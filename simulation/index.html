const FONTS={};

let tcache={},tcount=0;
function glyph(s,col,fk){
  const k=fk+col+'|'+s;if(tcache[k])return tcache[k];
  if(tcount>1500){tcache={};tcount=0;}
  const F=FONTS[fk],w=Math.max(1,s.length*F.w),o=document.createElement('canvas');o.width=w;o.height=F.h;
  const og=o.getContext('2d');og.fillStyle=col;
  for(let i=0;i<s.length;i++){let c=s.charCodeAt(i)-32;if(c<0||c>94)c=31;const rows=F.g[c];
    for(let y=0;y<F.h;y++){const b=rows[y];if(!b)continue;for(let x=0;x<F.w;x++)if(b&(1<<(F.w-1-x)))og.fillRect(i*F.w+x,y,1,1);}}
  tcount++;return tcache[k]={c:o,w:w,h:F.h};
}
function T(s,x,y,col,al,sc,fk){
  s=String(s);if(col===undefined)col=7;sc=sc||1;fk=fk||'b';const o=glyph(s,P[col],fk);const w=o.w*sc;
  if(al===1)x-=w>>1;else if(al===2)x-=w;
  g.drawImage(o.c,Math.round(x),Math.round(y),w,o.h*sc);return w;
}
function Ts(s,x,y,col,al){return T(s,x,y,col,al,1,'s');}
function tw(s,fk){return String(s).length*FONTS[fk||'b'].w;}
function wrap(s,maxw,fk){const out=[];let line='';for(const w of s.split(' ')){const t=line?line+' '+w:w;if(tw(t,fk)>maxw&&line){out.push(line);line=w;}else line=t;}if(line)out.push(line);return out;}

function r(x,y,w,h,c){g.fillStyle=P[c];g.fillRect(PX+x,PY+y,w,h);}
function oval(cx,cy,rx,ry,c){for(let j=-ry;j<=ry;j++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(j*j)/(ry*ry+.0001))));r(cx-w,cy+j,w*2,1,c);}}

  g.restore();
}
function waves(x,y,w,h,t){
  R(x,y,w,h,2);
  for(let j=0;j<h-4;j+=6){for(let i=-8;i<w;i+=10){const o=((j/6|0)%2)*5+((t*8)|0)%10;R(x+((i+o)%w+w)%w,y+j+2,4,1,3);R(x+((i+o+2)%w+w)%w,y+j+3,2,1,3);}}
}
function compass(cx,cy){
  for(let i=-14;i<=14;i++){const wd=14-Math.abs(i);R(cx-wd,cy+i,wd*2+1,1,i%2?4:5);}
  for(let i=-8;i<=8;i++){const wd=8-Math.abs(i);R(cx-wd,cy+i,wd*2+1,1,Math.abs(i)<3?8:15);}
  R(cx-1,cy-1,3,3,7);
}

const POLY=[

function inPoly(pts,x,y){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function buildMap(){
  // dihitung sendiri (tanpa membaca balik piksel kanvas, yang bisa diacak oleh perlindungan privasi browser HP)
  const grid=new Uint8Array(W*H);
  for(const [id,pts] of POLY)for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(inPoly(pts,x+.5,y+.5))grid[y*W+x]=id;
  const m=document.createElement('canvas');m.width=W;m.height=H;const mg=m.getContext('2d');
  mg.fillStyle=P[2];mg.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=7)for(let x=((y/7|0)%2)*6;x<W;x+=12){mg.fillStyle=P[1];mg.fillRect(x,y,4,1);}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const id=grid[y*W+x];if(!id)continue;
    const edge=(x>0&&!grid[y*W+x-1])||(x<W-1&&!grid[y*W+x+1])||(y>0&&!grid[(y-1)*W+x])||(y<H-1&&!grid[(y+1)*W+x]);
    mg.fillStyle=P[edge?15:LCOL[id]];if(!edge&&((x*7+y*13)%11===0))mg.fillStyle=P[id===6?4:10];mg.fillRect(x,y,1,1);
  }
  mapCv=m;
}

function newGame(){

function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify(S));}catch(e){}}
function load(){try{const j=localStorage.getItem(SAVEKEY);if(j){const o=JSON.parse(j);if(o&&o.stock&&o.hold)return o;}}catch(e){}return null;}
function holdTotal(){return S.hold.reduce((a,b)=>a+b,0);}
function dateStr(){const d=new Date(1522,4,17+S.day);return['Jan.','Feb.','Mar.','Apr.','May','Jun.','Jul.','Aug.','Sep.','Oct.','Nov.','Dec.'][d.getMonth()]+' '+d.getDate();}
function yearStr(){const d=new Date(1522,4,17+S.day);return d.getFullYear()+' A.D.';}
function clockStr(){let h=Math.floor(S.min/60)%24;const m=S.min%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+(m<10?'0':'')+m+' '+ap;}
function dayTick(){for(let p=0;p<PORTS.length;p++)for(let i=0;i<6;i++){const s=S.stock[p][i];S.stock[p][i]=s+(s<30?1:s>30?-1:0)+(Math.random()<.3?(Math.random()<.5?-1:1):0);if(S.stock[p][i]<0)S.stock[p][i]=0;}}
function act(m){S.min+=m;if(S.min>=1440){S.min-=1440;S.day++;dayTick();}}
function price(p,i){const P0=PORTS[p],st=S.stock[p][i];return Math.max(1,Math.round(GOODS[i][1]*P0.m[i]*(1+.12*Math.sin(S.day/6+i*1.7+p*.9))*(1-(st-30)/250)));}
function sellPrice(p,i){return Math.max(1,Math.floor(price(p,i)*SELLCUT));}
function pindex(p){let a=0;for(let i=0;i<6;i++)a+=price(p,i)/(GOODS[i][1]*PORTS[p].m[i]);return Math.round(a/6*100);}
function dist(a,b){return Math.hypot(PORTS[a].x-PORTS[b].x,PORTS[a].y-PORTS[b].y);}
function daysTo(a,b){return Math.max(2,Math.round(dist(a,b)/15));}

function btn(x,y,w,h,label,fn,o){
  o=o||{};const hov=M.x>=x&&M.x<x+w&&M.y>=y&&M.y<y+h&&!o.off;const sel=o.sel||hov;
  if(!o.flat){R(x,y,w,h,sel?0:o.off?13:15);if(!sel&&!o.off)R(x+1,y+1,w-2,h-2,o.bg===undefined?6:o.bg);else if(!sel)R(x+1,y+1,w-2,h-2,6);}
  else if(sel)R(x,y,w,h,0);
  if(label==='-')R(x+w/2-2,y+h/2,5,1,sel?7:15);else T(label,o.left?x+4:x+w/2,y+(h-9)/2|0,sel?7:o.off?12:15,o.left?0:1);
  hits.push({x:x,y:y,w:w,h:h,fn:fn,off:o.off});
}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointerdown',e=>{
  const [px,py]=pos(e);M.x=px;M.y=py;
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(px>=h.x&&px<h.x+h.w&&py>=h.y&&py<h.y+h.h){if(!h.off)h.fn();break;}}
});
cv.addEventListener('pointermove',e=>{const [px,py]=pos(e);M.x=px;M.y=py;});
cv.addEventListener('pointerleave',()=>{M.x=-1;M.y=-1;});
addEventListener('keydown',e=>{
  if(scene==='title'){if(e.key==='Enter'){S=load()||null;if(S&&hasSave){scene='port';say('Welcome back, Captain!');}else newGame();}return;}
  if(ev){if(e.key==='Enter'||e.key===' ')ev.fn();return;}
  const portScn=['port','buy','sell','prov','market'].includes(scene);
  if(portScn){
    if(e.key==='ArrowDown'){menuSel=(menuSel+1)%MENU.length;}
    else if(e.key==='ArrowUp'){menuSel=(menuSel+MENU.length-1)%MENU.length;}
    else if(e.key==='Enter'){menuAct(menuSel);}
    else if(e.key==='Escape'){scene='port';say('How may I help you?');}
  }else if(scene==='map'&&e.key==='Escape'){scene='port';selDest=-1;}
});

// ===== Aksi =====
function menuAct(i){
  menuSel=i;q=[0,0,0,0,0,0];
  if(i===0){scene='buy';say('What would you like to buy, Captain?');}
  else if(i===1){scene='sell';say(holdTotal()?'What would you like to sell?':'Your hold is empty, Captain.');}
  else if(i===2){scene='prov';say('Provisions keep the crew alive at sea. '+SUPPRICE+' gold per day.');}
  else if(i===3){scene='market';say('Here are the prices today.');}
  else if(i===4){scene='map';selDest=-1;}
}
function qtyReason(mode,newq){
  const p=S.at;let sum=0,cost=0;
  for(let i=0;i<6;i++){const n=newq[i];if(!n)continue;sum+=n;
    if(mode==='buy'){cost+=n*price(p,i);if(n>S.stock[p][i])return 'Only '+S.stock[p][i]+' '+GOODS[i][0]+' in stock.';}
    else if(n>S.hold[i])return 'You only have '+S.hold[i]+' '+GOODS[i][0]+'.';}
  if(mode==='buy'){if(cost>S.gold)return 'Not enough gold, Captain.';if(sum+holdTotal()>CAP)return 'The hold is full ('+CAP+' units).';}
  return null;
}
function bump(mode,i,d){
  const nq=q.slice();nq[i]=Math.max(0,nq[i]+d);if(nq[i]===q[i])return;
  const r=qtyReason(mode,nq);if(r){say(r);return;}q=nq;
}
function deal(mode){
  const p=S.at,n=q.reduce((a,b)=>a+b,0);if(!n){say('Choose how many first.');return;}
  const r=qtyReason(mode,q);if(r){say(r);return;}
  let total=0,profit=0;
  for(let i=0;i<6;i++){const k=q[i];if(!k)continue;
    if(mode==='buy'){const pr=price(p,i);S.avg[i]=(S.avg[i]*S.hold[i]+pr*k)/(S.hold[i]+k);S.hold[i]+=k;S.stock[p][i]-=k;S.gold-=pr*k;total+=pr*k;}
    else{const pr=sellPrice(p,i);profit+=(pr-S.avg[i])*k;S.hold[i]-=k;S.stock[p][i]+=k;S.gold+=pr*k;total+=pr*k;if(S.hold[i]===0)S.avg[i]=0;}
  }
  if(mode==='sell'&&profit>0)S.fame+=Math.floor(profit/25);
  q=[0,0,0,0,0,0];act(10);save();
  say(mode==='buy'?'A fine purchase! That is '+total+' gold.':'Pleasure doing business! You earned '+total+' gold.');
  checkBroke();
}
function checkBroke(){
  if(S.gold<2&&holdTotal()===0&&!ev){ev={text:'You have no gold and no cargo. Your voyage ends here.',btn:'New Voyage',fn:()=>{ev=null;try{localStorage.removeItem(SAVEKEY);}catch(e){}newGame();}};}
}
function startSail(){
  const d=daysTo(S.at,selDest);if(S.sup<d){say('Not enough provisions for '+d+' days.');scene='port';selDest=-1;return;}
  sail={from:S.at,to:selDest,days:d,d:0,t:0};S.min=6*60;scene='sail';selDest=-1;
}
function arrive(){
  S.at=sail.to;S.min=9*60+Math.floor(Math.random()*180);scene='port';menuSel=0;q=[0,0,0,0,0,0];
  say('Welcome to '+PORTS[S.at].n+', Captain! How may I help you?');sail=null;save();checkBroke();
}
function rollEvent(){
  const r=Math.random();
  if(r<.07){const idx=[];S.hold.forEach((h,i)=>{if(h>0)idx.push(i)});
    if(idx.length){const i=idx[Math.floor(Math.random()*idx.length)],lose=Math.max(1,Math.floor(S.hold[i]*(.1+Math.random()*.15)));S.hold[i]-=lose;if(!S.hold[i])S.avg[i]=0;
      ev={text:'A storm hits! '+lose+' '+GOODS[i][0]+' washed overboard.',btn:'OK',fn:()=>{ev=null;}};}
    else ev={text:'A storm hits, but the empty hold rides it out.',btn:'OK',fn:()=>{ev=null;}};
  }else if(r<.12){const lose=Math.floor(S.gold*(.1+Math.random()*.15));S.gold-=lose;
    ev={text:'Pirates raid the ship! You lose '+lose+' gold.',btn:'OK',fn:()=>{ev=null;checkBroke();}};
  }else if(r<.16&&sail.d<sail.days-1){sail.days--;
    ev={text:'A favorable wind! The voyage is one day shorter.',btn:'OK',fn:()=>{ev=null;}};}
}

// ===== Gambar tiap layar =====
function sidePanels(){
  const p=PORTS[S.at];
  box(0,0,48,30,6);T(dateStr(),24,5,15,1);Ts(yearStr(),24,18,15,1);
  waves(0,32,48,64,tNow);
  R(2,98,44,14,15);T(clockStr(),24,102,7,1);
  box(0,116,48,84,6);
  T('Fame',24,122,4,1);T(S.fame,24,133,15,1);
  T('Gold',24,148,4,1);T(S.gold,24,159,15,1);
  T('Food',24,174,4,1);T(S.sup+' d',24,185,S.sup<3?8:15,1);
  box(244,0,76,34,6);T(p.n,282,6,15,1);Ts(p.r,282,20,4,1);
  box(244,36,76,100,6);
  for(let i=0;i<MENU.length;i++)btn(249,42+i*16,66,13,MENU[i],()=>menuAct(i),{sel:menuSel===i,flat:true});
  box(244,138,76,30,6);T('Price Idx',282,143,15,1);T(pindex(S.at)+'%',282,154,15,1);
  R(244,168,76,32,2);compass(282,184);
}
function backdrop(){
  R(48,0,196,200,15);
  for(let y=66,r=0;y<200;y+=26,r++)for(let x=50+(r%2)*20;x<242;x+=40)galleon(x,y,2,1,1,1,1,1,1);
}
function topScene(){
  const p=PORTS[S.at];
  portrait(52,4,p,say_n<say_s.length&&((tNow*10)|0)%2);
  box(118,4,124,58,6);
  const lines=wrap(say_s.substr(0,Math.floor(say_n)),108);
  lines.slice(0,5).forEach((l,i)=>T(l,124,10+i*10,15));
}
function listScene(mode){
  const px=52,py=66,p=S.at;
  box(px,py,188,128,6);
  T(mode==='buy'?'Buy':'Sell',px+6,py+5,8);
  T('Cost',px+44,py+5,4);T('Own',px+72,py+5,4);if(mode==='buy')T('Stk',px+98,py+5,4);T('Qty',px+120,py+5,4);
  for(let i=0;i<6;i++){
    const y=py+19+i*13;
    T(GOODS[i][0],px+6,y,15);T(mode==='buy'?price(p,i):sellPrice(p,i),px+44,y,15);T(S.hold[i],px+74,y,15);
    if(mode==='buy')T(S.stock[p][i],px+98,y,15);
    T(q[i],px+122,y,q[i]?8:15);
    btn(px+134,y-2,12,11,'-',()=>bump(mode,i,-1),{});
    btn(px+147,y-2,12,11,'+',()=>bump(mode,i,1),{});
    btn(px+160,y-2,23,11,'+10',()=>bump(mode,i,10),{});
  }
  let tot=0;for(let i=0;i<6;i++)tot+=q[i]*(mode==='buy'?price(p,i):sellPrice(p,i));
  T((mode==='buy'?'Cost: ':'Gain: ')+tot,px+8,py+98,15);
  T('Hold '+holdTotal()+'/'+CAP,px+120,py+98,15);
  btn(px+8,py+110,50,13,mode==='buy'?'Buy':'Sell',()=>deal(mode),{});
  btn(px+64,py+110,50,13,'Back',()=>{scene='port';q=[0,0,0,0,0,0];say('How may I help you?');},{});
}
function provScene(){
  const px=52,py=66;box(px,py,188,128,6);
  T('Provisions',px+8,py+6,15);
  T('Price: '+SUPPRICE+' gold per day',px+8,py+24,15);
  T('Now: '+S.sup+' days (max '+SUPCAP+')',px+8,py+38,15);
  T('Gold: '+S.gold,px+8,py+52,15);
  [1,5,10].forEach((n,i)=>btn(px+8+i*58,py+70,52,13,'Buy '+n,()=>{
    if(S.sup+n>SUPCAP){say('The ship cannot carry that many provisions.');return;}
    if(S.gold<n*SUPPRICE){say('Not enough gold, Captain.');return;}
    S.gold-=n*SUPPRICE;S.sup+=n;act(10);save();say('Provisions loaded: '+n+' days.');checkBroke();},{}));
  btn(px+8,py+92,50,13,'Back',()=>{scene='port';say('How may I help you?');},{});
}
function marketScene(){
  const px=52,py=66,p=S.at;box(px,py,188,128,6);
  T('Market Rate',px+6,py+5,8);
  T('Buy',px+60,py+20,4);T('Sell',px+96,py+20,4);T('Stk',px+134,py+20,4);T('Now',px+160,py+20,4);
  for(let i=0;i<6;i++){
    const y=py+32+i*13,base=GOODS[i][1]*PORTS[p].m[i],pr=price(p,i),tr=pr/base;
    T(GOODS[i][0],px+8,y,15);T(pr,px+60,y,15);T(sellPrice(p,i),px+96,y,15);T(S.stock[p][i],px+134,y,15);
    T(tr>1.05?'high':tr<.95?'low':'fair',px+160,y,tr>1.05?8:tr<.95?10:15);
  }
  btn(px+8,py+110,50,13,'Back',()=>{scene='port';say('How may I help you?');},{});
}
function mapScene(live){
  if(!mapCv)buildMap();g.drawImage(mapCv,0,0);
  // garis rute
  if(live&&sail){const a=PORTS[sail.from],b=PORTS[sail.to];const n=Math.floor(dist(sail.from,sail.to)/4);for(let i=0;i<=n;i++)R(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,1,1,7);}
  if(!live&&selDest>=0){const a=PORTS[S.at],b=PORTS[selDest];const n=Math.floor(dist(S.at,selDest)/4);for(let i=0;i<=n;i++)R(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,1,1,7);}
  PORTS.forEach((p,i)=>{
    R(p.x-3,p.y-3,7,7,15);R(p.x-2,p.y-2,5,5,i===S.at?8:selDest===i?5:7);
    const lw=tw(p.n,'s')+2,lx=Math.min(W-lw-1,Math.max(1,p.x+p.lab[0])),ly=p.y+p.lab[1];
    R(lx-1,ly-1,lw+2,10,15);Ts(p.n,lx+1,ly,7);
    if(!live)hits.push({x:p.x-8,y:p.y-8,w:16,h:16,fn:()=>{if(i!==S.at)selDest=i;}});
  });
  if(live&&sail){
    const pr=(sail.d+sail.t/0.45)/sail.days,a=PORTS[sail.from],b=PORTS[sail.to];
    const x=a.x+(b.x-a.x)*pr,y=a.y+(b.y-a.y)*pr;
    R(x-10,y+8,20,2,3);galleon(Math.round(x-12),Math.round(y-10),7,13,15,4,15,5,8);
    box(70,162,180,34,6);T(dateStr()+', '+yearStr(),160,169,15,1);
    T('To '+PORTS[sail.to].n+': '+Math.max(0,sail.days-sail.d)+' days left',160,181,15,1);
  }
  if(!live){
    btn(4,4,40,13,'Back',()=>{scene='port';selDest=-1;say('How may I help you?');},{});
    if(selDest<0){box(70,4,180,26,6);T('Choose a destination',160,9,15,1);T('Tap a port on the map',160,19,4,1);}
    if(selDest>=0){
      const d=daysTo(S.at,selDest),ok=S.sup>=d;
      box(60,4,200,46,6);
      T(PORTS[S.at].n+' -> '+PORTS[selDest].n,160,9,15,1);
      T(d+' days, food needed '+d+' (have '+S.sup+')',160,20,ok?15:8,1);
      btn(90,33,60,13,'Set Sail',startSail,{off:!ok});
      btn(170,33,60,13,'Cancel',()=>{selDest=-1;},{});
    }
  }
}
function evBox(){
  box(50,70,220,58,6);
  wrap(ev.text,200).forEach((l,i)=>T(l,160,78+i*10,15,1));
  btn(120,108,80,14,ev.btn||'OK',ev.fn,{});
}
function titleScene(){
  R(0,0,W,H,15);
  for(let y=4,r=0;y<H;y+=26,r++)for(let x=(r%2)*20;x<W;x+=40)galleon(x,y,2,1,1,1,1,1,1);
  box(40,40,240,70,6);
  T('PELAYARAN DAGANG',160,52,8,1,2);
  T('A pixel trading voyage',160,78,15,1);
  T('London, 1522 A.D.',160,90,4,1);
  btn(100,124,120,16,'New Voyage',()=>{try{localStorage.removeItem(SAVEKEY);}catch(e){}newGame();},{});
  if(hasSave)btn(100,146,120,16,'Continue',()=>{const o=load();if(o){S=o;q=[0,0,0,0,0,0];scene='port';menuSel=0;say('Welcome back, Captain!');}},{});
}

// ===== Loop =====
let last=performance.now();
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;tNow+=dt;hits=[];
  say_n=Math.min(say_s.length,say_n+dt*60);
  if(scene==='sail'&&sail&&!ev){
    sail.t+=dt;
    if(sail.t>=.45){sail.t-=.45;sail.d++;S.day++;S.sup--;S.min=6*60;dayTick();
      if(S.sup<0){S.sup=0;}
      if(sail.d>=sail.days)arrive();else rollEvent();}
  }
  if(scene==='title')titleScene();
  else if(scene==='map')mapScene(false);
  else if(scene==='sail')mapScene(true);
  else{
    backdrop();sidePanels();topScene();
    if(scene==='buy'||scene==='sell')listScene(scene);
    else if(scene==='prov')provScene();
    else if(scene==='market')marketScene();
  }
  if(ev)evBox();
  requestAnimationFrame(frame);
}
hasSave=!!load();
window.sim={get S(){return S;},get scene(){return scene;},menuAct:menuAct,newGame:newGame,sail:()=>sail,set evNull(v){ev=null;}};
requestAnimationFrame(frame);
</script></body></html>
