<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Attack on DEPR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#12161d;--panel:#1b222d;--line:#2e3948;--fg:#e9ecf1;--muted:#93a0b4;--gold:#f2c14e;--ours:#4a86e0;--foe:#e4572e;--go:#6bbf59;--accent:#58b4e8;--px:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;padding:max(4px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#app{height:100%;display:flex;flex-direction:column;gap:5px;min-height:0}
button{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:5px 6px;cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){border-color:var(--accent);transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
#hud{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;font:9px var(--px);white-space:nowrap}
#hud .g{color:var(--gold)}
#hud .lv{color:#ff6b6b;letter-spacing:1px}
#hud .sp{flex:1}
#hud button{font:9px var(--px);padding:5px 7px}
#core{flex:1;min-width:60px;height:12px;background:#0b0e13;border:2px solid #ff8a66;box-shadow:0 0 6px rgba(255,100,60,.5)}
#core i{display:block;height:100%;width:100%;background:var(--foe);transform-origin:left;transition:transform .15s}
#stage{position:relative;flex:1;min-height:120px;background:#0c0f14;border:2px solid var(--line)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000c;border:2px solid var(--line);padding:4px 9px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#ctl{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
@media(orientation:portrait){#rLane{flex:.55}#stage{flex:0 0 auto;height:min(64vw,46vh)}#ctl{flex:1;min-height:0}.row{flex:1;min-height:0}.row>button{font-size:12px}.row .tl{font-size:9px}.hero b{font-size:8px}}
.row{display:flex;gap:4px}
.row>button.ic{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background-repeat:no-repeat;background-position:center 5px;background-size:auto 46%}
.row>button{flex:1 1 0;min-width:0;font-size:10px;line-height:1.15;padding:5px 2px;text-align:center}
.row .tl{font:8px var(--px)}
.lane.on{border-color:var(--gold);background:#2a2412}
.hero{position:relative;overflow:hidden}
.hero b{display:block;font:7px var(--px);color:var(--gold);margin-bottom:2px}
.hero.live{border-color:#5fd18a}
.hero .cdv{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.small{color:var(--muted);font-size:9px}
#overlay{position:fixed;inset:0;background:rgba(8,10,14,.88);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;text-align:center}
#overlay .box{max-width:520px;width:100%;border:3px solid var(--line);background:var(--panel);padding:16px 14px}
#overlay h1{font:15px/1.5 var(--px);margin:0 0 6px;color:#ff6b3a;text-shadow:2px 2px 0 #000}
#overlay h2{font:11px/1.6 var(--px);margin:0 0 8px;color:var(--gold)}
#overlay p{margin:6px 0;color:#c8d0dc;font-size:12px;line-height:1.5}
#overlay button{font:10px var(--px);padding:9px 12px;margin:4px 3px;border-color:var(--gold)}
.stg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.stg button{width:44px;padding:8px 0;font:10px var(--px)}
.stg button.cur{border-color:var(--gold);background:#2a2412}
</style>
</head>
<body>
<div id="app">
 <div id="hud">
  <span class="lv" id="lives"></span>
  <span class="g" id="gold">0</span>
  <span id="wave">W0</span>
  <div id="core"><i id="coreI"></i></div>
  <button id="bSpd">x1</button><button id="bCam">CAM</button><button id="bPause">||</button>
 </div>
 <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="overlay"></div></div>
 <div id="ctl">
  <div class="row" id="rLane"></div>
  <div class="row" id="rUnit"></div>
  <div class="row" id="rHero"></div>
  <div class="row" id="rNews"></div>
  <div class="row" id="rUp"></div>
 </div>
</div>

/* ---------- audio ---------- */
function sfx(k){if(muted||!acx)return;try{const o=acx.createOscillator(),g=acx.createGain(),t=acx.currentTime;const f={hit:180,shot:520,spawn:320,err:110,boom:70,skill:660}[k]||200;o.type=k==='boom'?'sawtooth':'square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(k==='skill'?1.6:.6),t+.12);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(acx.destination);o.start(t);o.stop(t+.15);}catch(e){}}

/* ---------- state ---------- */
function newGame(n){
  const st=STAGES[n-1];
  S={stage:n,st,time:0,gold:200,lives:20,wave:0,waveT:6,ewT:4,sq:[],units:[],proj:[],fx:[],texts:[],
     lane:1,plv:0,elv:0,over:false,paused:false,speed:1,follow:true,cam:0,shake:0,uid:0,
     heroes:{},hcd:{},skcd:{},ucd:{},bossF:[false,false],freeze:0,msg:''};
  S.towers=[];S.trains=[];S.news={};S.tv={t:0,text:'',sub:''};
  if(USE_TOWERS)for(let l=0;l<3;l++)for(const tx of[TOW_OUT,TOW_IN]){const hp=Math.round(st.tow*(tx===TOW_OUT?1:1.3));S.towers.push({tower:1,team:1,x:tx,lane:l,y:LANEY[l],hp,max:hp,flash:0,dying:0,gone:false,cd:rnd(.5,2),outer:tx===TOW_OUT});}
  S.core={core:1,team:1,x:CORE_X,y:350,hp:st.core,max:st.core,flash:0,dying:0,gone:false,cd:2};
  HEROES.forEach(k=>{S.hcd[k]=0;S.skcd[k]=0;});UNITS.forEach(k=>S.ucd[k]=0);
  for(let l=0;l<3;l++)for(let i=0;i<5;i++){const u=mk('poli',1,TOW_IN-40+i*GAP,l,st.mult);u.cd=rnd(0,1);}
  buildUI();hideOverlay();toast('Stage '+n+': '+st.name);
}
const pmult=()=>1+.25*S.plv;
const income=()=>6+3*S.elv;
const USE_TOWERS=false; /* menara/benteng lama disimpan (kode tetap ada), sekarang diganti barikade Poli */
const coreOpen=()=>USE_TOWERS?([0,1,2].some(l=>S.towers.every(w=>w.gone||w.lane!==l))):[0,1,2].some(l=>!S.units.some(u=>u.team===1&&u.type==='poli'&&u.dying<=0&&u.lane===l));
function mk(type,team,x,lane,m){
  {const dd=team===0?DEF[type]:EDEF[type];if(!(dd&&dd.hero)){let nx=x;const sg=team===0?-1:1;for(let t=0;t<40;t++){if(S.units.some(o=>o.team===team&&o.lane===lane&&!o.dying&&Math.abs(o.x-nx)<GAP-2))nx+=sg*GAP;else break;}x=clamp(nx,4,WW-4);}}
  const d=team===0?DEF[type]:EDEF[type],mm=m||1,hm=d.hero?pmult()*.5+.5:mm;
  const u={id:++S.uid,type,team,x,lane,y:LANEY[lane],hp:d.hp*hm,max:d.hp*hm,dmg:d.dmg*(team===0?pmult()*(d.hero?.6+.4:1):mm),range:d.range,rate:d.rate,sp:d.sp,sc:d.sc,d,
     cd:rnd(0,d.rate||1),bcd:rnd(7,11),atk:0,ph:rnd(0,6),flash:0,dying:0,stun:0,conf:0,slow:0,shield:0,hero:!!d.hero,jump:0};
  S.units.push(u);return u;
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1700);}
function floatText(x,y,t,col){S.texts.push({x,y,t,life:.9,col:col||'#fff'});}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(20,sp||110);S.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:rnd(.3,.6),max:.6,col});}}

/* ---------- aksi pemain ---------- */
function sendUnit(k){
  if(!S||S.over||S.paused)return;const d=DEF[k];
  if(S.ucd[k]>0)return;
  if(S.gold<d.cost){toast('Uang kurang');sfx('err');return;}
  if(S.units.filter(u=>u.team===0&&!u.dying).length>=60){toast('Pasukan penuh');return;}
  S.gold-=d.cost;S.ucd[k]=1.2;mk(k,0,SPAWNX,S.lane);sfx('spawn');
}
function setLane(l){if(!S)return;S.lane=l;for(const k of HEROES){const h=S.heroes[k];if(h&&!h.dying)h.lane=l;}buildLaneRow();}
function heroAct(k){
  if(!S||S.over||S.paused)return;
  const h=S.heroes[k],d=DEF[k];
  if(!h||h.dying){
    if(S.hcd[k]>0){toast(d.name+' bisa dipanggil lagi '+Math.ceil(S.hcd[k])+'d');sfx('err');return;}
    if(S.gold<d.cost){toast('Uang kurang');sfx('err');return;}
    S.gold-=d.cost;const u=mk(k,0,SPAWNX+20,S.lane);S.heroes[k]=u;S.skcd[k]=Math.max(S.skcd[k],2);ring(u.x,u.y,60,'#f2c14e');sfx('spawn');toast(d.name+' turun ke medan perang!');return;
  }
  castSkill(k);
}
function foesNear(x,r,lane){return S.units.filter(o=>o.team===1&&!o.dying&&Math.abs(o.x-x)<=r&&(lane==null||Math.abs(o.lane-lane)<=1));}
function castSkill(k){
  const h=S.heroes[k],d=DEF[k];if(!h||h.dying)return;
  if(S.skcd[k]>0){toast(d.skill+': tunggu '+Math.ceil(S.skcd[k])+'d');sfx('err');return;}
  if(h.stun>0)return;
  const dmgBase=h.dmg;
  if(k==='kangbewok'){
    const t=foesNear(h.x+30,110,h.lane);ring(h.x+30,h.y,100,'#58b4e8');h.shield=4;S.shake=.25;
    t.forEach(o=>{hurt(o,60+dmgBase*1.5,h);o.stun=1.6;});floatText(h.x,h.y-70,'Perisai Banting!','#58b4e8');
  }else if(k==='rokigirang'){
    const tx=h.x+170,t=foesNear(tx,110,h.lane);ring(tx,h.y,90,'#ff7a7a');
    t.forEach(o=>hurt(o,110+dmgBase*3,h));
    S.fx.push({text:pick(['Mana datanya?','Logical Fallacy!','Ad Hominem!','Ngawur!','Strawman!','Dungu!']),x:h.x+40,y:h.y-80,life:1.2,max:1.2,col:'#ff7a7a'});
  }else if(k==='bimo'){
    const t=foesNear(h.x,170,h.lane);ring(h.x,h.y,170,'#6be08a');
    t.forEach(o=>{o.conf=3.5;o.slow=4;});floatText(h.x,h.y-70,'Bingung!','#6be08a');
  }else if(k==='retrobro'){
    h.jump=.6;h.jx=h.x;h.tx=h.x+190;
  }
  S.skcd[k]=d.scd;sfx('skill');
}
function newsAct(k){
  if(!S||S.over||S.paused)return;const d=NEWS[k];
  if(S.news[k]){toast(d.name+' sudah meliput');return;}
  if(S.gold<d.cost){toast('Uang kurang');sfx('err');return;}
  S.gold-=d.cost;const fx=newsFront();
  S.news[k]={type:k,team:0,d:{},sc:d.sc,x:Math.max(30,fx-d.off),y:236,ph:0,wd:0,mv:0,atk:0,flash:0,dying:0,stun:0,cd:4,hp:1,max:1};
  sfx('spawn');toast(d.name+' mulai meliput!');
}
function newsFront(){const f=S.units.filter(u=>u.team===0&&!u.dying).sort((a,b)=>b.x-a.x).slice(0,3);return f.length?f.reduce((a,u)=>a+u.x,0)/f.length:SPAWNX;}
function tvShow(text,sub){S.tv={t:4.5,text,sub:sub||''};}
function newsUpdate(dt){
  const fx=newsFront();
  for(const k of NEWSK){const n=S.news[k];if(!n)continue;const d=NEWS[k];
    n.atk=Math.max(0,n.atk-dt);n.mv=Math.max(0,n.mv-dt);
    const tx=clamp(fx-d.off,30,WW-300),dx=tx-n.x;
    if(Math.abs(dx)>6){const stp=Math.sign(dx)*Math.min(Math.abs(dx),70*dt);n.x+=stp;n.wd+=Math.abs(stp);n.mv=.15;}
    n.cd-=dt;
    if(n.cd<=0){n.cd=d.every;n.atk=.28;
      if(k==='reporter'){
        const hl=pick(['BREAKING: Massa makin ramai!','Warga turun ke jalan','Barikade Poli viral di medsos','Aksi damai jadi trending']);
        tvShow(hl,'Pejuang semangat! +30% serangan');
        S.units.forEach(u=>{if(u.team===0&&!u.dying){if(!(u.buff>0))u.dmg*=1.3;u.buff=8;}});sfx('skill');
      }else{
        tvShow('CUPLIKAN: bantuan dari kiri!','Massa tergerak oleh berita, siap menyerang');
        if(S.units.filter(u=>u.team===0&&!u.dying).length<54)for(let l=0;l<3;l++){S.sq.push({t:l*.35,team:0,type:'prajurit',l},{t:.2+l*.35,team:0,type:'pemanah',l});}
        sfx('skill');
      }
    }
  }
  if(S.tv.t>0)S.tv.t-=dt;
}
function buyUp(w){
  if(!S||S.over||S.paused)return;
  const lv=w==='p'?S.plv:S.elv,tbl=w==='p'?PUP:EUP;
  if(lv>=tbl.length){toast('Sudah maksimal');return;}
  if(S.gold<tbl[lv]){toast('Uang kurang');sfx('err');return;}
  S.gold-=tbl[lv];if(w==='p'){S.plv++;S.units.forEach(u=>{if(u.team===0&&!u.dying){u.dmg*=(1+.25*S.plv)/(1+.25*(S.plv-1));const r=u.max*(1+.25*S.plv)/(1+.25*(S.plv-1));u.hp+=r-u.max;u.max=r;}});}else S.elv++;
  sfx('spawn');toast(w==='p'?'Pasukan Lv '+S.plv:'Ekonomi Lv '+S.elv);
}

/* ---------- damage ---------- */
function hurt(t,d,src){
  if(t.dying>0||t.gone)return;
  if(t.shield>0)d*=.4;
  if(t.d&&t.d.armor)d*=t.d.armor;
  t.hp-=d;t.flash=.12;floatText(t.x,t.y-(t.tower?85:t.core?130:(t.d?t.d.sc*SPH+14:40)),Math.round(d),t.team===1?'#ffd166':'#ff6b6b');
  if(t.hp<=0)die(t,src);
}
function die(t,src){
  if(t.core||t.tower){t.dying=.7;t.hp=0;S.shake=.5;sfx('boom');burst(t.x,t.y-20,'#c9a46a',24,160);burst(t.x,t.y-30,'#ff7a2a',14,140);
    if(t.core){S.over=true;S.win=true;setTimeout(()=>endGame(true),900);}else floatText(t.x,t.y-80,'Menara runtuh!','#ffd166');
    return;}
  t.dying=.55;t.hp=0;burst(t.x,t.y-14,t.team===1?'#7fb040':'#6a8cff',8,90);
  if(t.team===1){S.gold+=t.d.rw||5;floatText(t.x,t.y-30,'+'+(t.d.rw||5),'#f2c14e');}
  else if(t.hero){S.heroes[t.type]=null;S.hcd[t.type]=25;S.skcd[t.type]=0;toast(t.d.name+' gugur. Panggil lagi 25d');}
}

/* ---------- AI ---------- */
function structTargets(){const a=[];for(const w of S.towers)if(!w.gone&&w.dying<=0)a.push(w);if(!S.core.gone&&S.core.dying<=0&&coreOpen())a.push(S.core);return a;}
function update(dt){
  if(!S||S.over||S.paused)return;
  S.time+=dt;S.gold=Math.min(1500,S.gold+income()*dt);
  for(const k in S.ucd)S.ucd[k]=Math.max(0,S.ucd[k]-dt);
  for(const k in S.hcd)if(!S.heroes[k])S.hcd[k]=Math.max(0,S.hcd[k]-dt);
  for(const k in S.skcd)S.skcd[k]=Math.max(0,S.skcd[k]-dt);
  S.shake=Math.max(0,S.shake-dt);
  // gelombang pasukan sendiri (otomatis, ala Dota)
  S.waveT-=dt;
  if(S.waveT<=0){S.waveT=13;if(S.units.filter(u=>u.team===0&&!u.dying).length>54)S.waveT=4;else{S.wave++;const comp=S.wave>2?['prajurit','prajurit','pemanah','prajurit','pemanah']:['prajurit','prajurit','prajurit','pemanah'];
    comp.forEach((t,i)=>{for(let l=0;l<3;l++)S.sq.push({t:i*.6+l*.2,team:0,type:t,l});});}}
  // gelombang musuh
  S.ewT-=dt;
  if(S.ewT<=0){S.ewT=S.st.every*rnd(.9,1.15);S.ew=(S.ew||0)+1;enemyWave();}
  for(const q of S.sq)q.t-=dt;
  S.sq=S.sq.filter(q=>{if(q.t>0)return true;if(q.team===0)mk(q.type,0,SPAWNX,q.l);else mk(q.type,1,ESPAWN,q.l,q.m);return false;});
  // core memanggil boss saat terdesak
  const cr=S.core.hp/S.core.max;[.66,.33].forEach((th,i)=>{if(!S.bossF[i]&&cr<th){S.bossF[i]=true;const ty=i?'bunda':'rajajas';if(!S.units.some(u=>u.type===ty&&u.dying<=0)){S.sq.push({t:.5,team:1,type:ty,l:Math.floor(Math.random()*3),m:S.st.mult});toast('Benteng memanggil '+EDEF[ty].name+'!');}}});

  const tg=structTargets();
  const LN=[[[],[],[]],[[],[],[]]];for(const o of S.units)if(o.dying<=0)LN[o.team][o.lane].push(o);
  for(const u of S.units){
    if(u.dying>0){u.dying-=dt;continue;}
    u.flash=Math.max(0,u.flash-dt);u.atk=Math.max(0,u.atk-dt);u.cd-=dt;u.mv=Math.max(0,(u.mv||0)-dt);u.stun=Math.max(0,u.stun-dt);u.conf=Math.max(0,u.conf-dt);u.slow=Math.max(0,u.slow-dt);u.shield=Math.max(0,u.shield-dt);
    u.y+=(LANEY[u.lane]-u.y)*Math.min(1,dt*6);
    if(u.buff>0){u.buff-=dt;if(u.buff<=0)u.dmg/=1.3;}
    if(u.burn>0){u.burn-=dt;u.bt=(u.bt||0)+dt;if(u.bt>=.5){u.bt=0;hurt(u,3,null);if(u.dying>0)continue;}}
    if(u.jump>0){ // loncat injak
      u.jump-=dt;const k=1-u.jump/.6;u.x=u.jx+(u.tx-u.jx)*k;
      if(u.jump<=0){u.jump=0;ring(u.x,u.y,100,'#ff6b3a');S.shake=.3;foesNear(u.x,110,u.lane).forEach(o=>{hurt(o,130+u.dmg*3,u);o.stun=1;});sfx('boom');}
      continue;
    }
    if(u.stun>0)continue;
    const dir=u.team===0?1:-1,foe=1-u.team;
    let bt=null,bd=1e9;
    if(u.conf<=0){
      for(const o of LN[foe][u.lane]){if(o.dying>0)continue;const d=Math.abs(o.x-u.x);if(d<bd&&((o.x-u.x)*dir>-20)){bd=d;bt=o;}}
      if(u.team===0)for(const w of tg){if(w.lane!==undefined&&w.lane!==u.lane)continue;const d=Math.abs(w.x-u.x)-(w.core?30:6);if(d<bd&&(w.x-u.x)*dir>-20){bd=d;bt=w;}}
    }
    if(u.d.mol){ // ilmu marah-marah: dorong mundur + damage
      u.rage=(u.rage||0)-dt;
      if(u.rage<=0){
        const near=LN[foe][u.lane].filter(o=>o.dying<=0&&(o.x-u.x)*dir>-10&&Math.abs(o.x-u.x)<=95);
        if(near.length){
          u.rage=5;u.atk=.28;u.cd=Math.max(u.cd,.5);
          near.forEach(o=>{hurt(o,u.dmg*1.3,u);if(o.dying>0)return;if(o.d.boss){o.slow=2;o.x=clamp(o.x+dir*14,2,WW-4);}else{o.x=clamp(o.x+dir*60,2,WW-4);o.stun=Math.max(o.stun,.5);}});
          ring(u.x+dir*40,u.y,95,'#ff8fb8');S.fx.push({text:pick(['MARAH!!','MUNDUR!','TURUNKAN HARGA!','DENGARKAN KAMI!']),x:u.x-10,y:u.y-u.sc*SPH-10,life:1,max:1,col:'#ff8fb8'});S.shake=Math.max(S.shake,.12);sfx('skill');
        }
      }
    }
    if(u.riding)continue;
    if(u.d.boss&&u.team===1&&u.x<=2070){ // skill boss
      u.bcd-=dt;
      if(u.bcd<=0){
        if(u.type==='bunda'){
          const pool=S.units.filter(o=>o.team===0&&!o.dying&&!o.hero).sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x)),vs=pool.slice(0,Math.max(3,Math.min(10,Math.ceil(pool.length*.4))));
          if(vs.length){u.atk=.28;u.bcd=15*rnd(.9,1.2);ring(u.x,u.y,120,'#ffd166');S.fx.push({text:'NAIKIN PAJAK!!',x:u.x-20,y:u.y-u.sc*SPH-14,life:1.2,max:1.2,col:'#ffd166'});vs.forEach(o=>{floatText(o.x,o.y-50,'hilang','#ffd166');hurt(o,99999,u);});sfx('skill');}else u.bcd=3;
        }else if(Math.random()<.5&&S.units.some(o=>o.team===0&&!o.dying)){ // saya akan lawan: tim lawan mundur
          u.bcd=12*rnd(.9,1.2);u.atk=.28;ring(u.x,u.y,260,'#ffffff');S.fx.push({text:'SAYA AKAN LAWAN!',x:u.x-60,y:u.y-u.sc*SPH-14,life:1.4,max:1.4,col:'#ffffff'});S.shake=Math.max(S.shake,.2);sfx('skill');
          S.units.forEach(o=>{if(o.team===0&&!o.dying&&o.x>u.x-700){o.x=clamp(o.x-(o.hero?60:130),2,WW-4);o.stun=Math.max(o.stun,.5);}});
        }else{

      let hf=1;if(u.team===1){const hx=u.d.boss?2070:1900;if(u.x<=hx){hf=u.d.boss?0:(LN[0][u.lane].some(o=>Math.abs(o.x-u.x)<320)?0:.3);}}

  }
  // menara & benteng menembak

      if(bt&&bd<=R){w.cd=w.core?2.4:1.5;S.proj.push({x:w.x,y:w.y-(w.core?108:80),t:bt,dmg:(w.core?45:20)*S.st.mult,team:1,kind:w.core?'boulder':'arrow',sp:w.core?240:360,src:w});sfx('shot');}

  }

function man(x,y,o){
  const p=o.s*2,d=o.dir,c=ctx;
  const fl=o.fl>0;
  c.globalAlpha=.3;R(x-4.5*p,y-.6*p,9*p,1.2*p,'#000');c.globalAlpha=1;
  const lw=Math.sin(o.ph)*1.5*p;
  const body=fl?'#fff':o.body,skin=fl?'#fff':o.skin,leg=fl?'#fff':o.leg;
  R(x-2.4*p+lw,y-5*p,2*p,5*p,leg);R(x+.4*p-lw,y-5*p,2*p,5*p,leg);
  R(x-3*p,y-12*p,6*p,7.2*p,body);

  const hs=o.titan?6.2:5;
  R(x-hs/2*p,y-12*p-hs*p,hs*p,hs*p,skin);
  if(!o.titan)R(x-hs/2*p,y-12.4*p-hs*p,hs*p,1.9*p,fl?'#fff':o.hair);
  R(x+d*1.1*p-.5*p,y-12*p-hs*p*.62,1.1*p,1.1*p,'#111');
  if(o.titan){R(x+d*.2*p-1.6*p,y-12*p-hs*p*.2,3.2*p,.9*p,'#fff');R(x+d*1.2*p,y-12*p-hs*p*.74,1.1*p,.5*p,'#111');}
  // senjata
  const a=o.atk>0?(1-o.atk/.28):0;
  c.save();c.translate(x+d*2.6*p,y-9*p);
  if(o.weapon==='sword'||o.weapon==='club'){c.rotate(d*(-1.1+a*2.4));R(0,-1*p,(o.weapon==='club'?7:6.5)*p,1.4*p,o.weapon==='club'?'#6b4a22':'#d8dde8');if(o.weapon==='club')R(5*p,-2*p,3*p,3.4*p,'#6b4a22');}
  else if(o.weapon==='bow'){c.scale(d,1);R(0,-4*p,1*p,8*p,'#7a5226');R(0,-4*p,3*p,1*p,'#cfa');R(0,3*p,3*p,1*p,'#cfa');if(a>0)R(-1*p,-0.4*p,5*p,.6*p,'#fff');}

}
function sprUnit(u,y){
  const A=ATL[ART[u.type]];if(!A||!A.ok)return 0;
  const H=SPH*u.sc*1,k=H/A.H,dir=u.team===0?1:-1,I=A.i;
  let fi=I.idle;
  if(u.dying>0&&I.ko>=0)fi=I.ko;
  else if(u.stun>0&&I.hit>=0)fi=I.hit;
  else if(u.atk>0){const p=1-u.atk/.28,n=I.atk.length;fi=I.atk[Math.min(n-1,Math.floor(p*n))];}
  else if(u.mv>0)fi=I.walk[Math.floor((u.wd||0)/(H*.22))%4];
  const f=A.f[fi],w=f[1]*k,h=f[2]*k;
  ctx.globalAlpha=.3;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(u.x,y-1,Math.max(8,w*.32),3,0,0,6.28);ctx.fill();ctx.globalAlpha=1;
  ctx.save();
  if(u.dying>0){const kk=Math.max(0,u.dying/.55);ctx.globalAlpha=Math.min(1,kk*1.6);if(I.ko<0){ctx.translate(u.x,y);ctx.rotate(dir*(1-kk)*1.4);ctx.translate(-u.x,-y);}}
  if(u.team===1)ctx.translate(u.x,0),ctx.scale(-1,1),ctx.translate(-u.x,0);
  if(u.flash>0&&u.dying<=0){if('filter' in ctx)ctx.filter='brightness(2.2)';else ctx.globalAlpha*=.75;}
  else if(u.d.tint&&'filter' in ctx)ctx.filter=u.d.tint;
  const bob=(u.mv>0&&fi!==I.idle&&u.atk<=0)?Math.abs(Math.cos((u.wd||0)/(H*.22)*Math.PI/2))*H*.025:0;
  ctx.drawImage(A.im,f[0],A.H-f[2],f[1],f[2],u.x-(f[3]!==undefined?f[3]*k:w/2),y-h-bob,w,h);
  ctx.restore();return H;
}
function drawUnit(u){

  const x=T.x,y=T.y,L=T.len;
  ctx.globalAlpha=.3;R(x-L/2,y-2,L,5,'#000');ctx.globalAlpha=1;
  R(x-L/2,y-50,L,46,'#8a8fa8');R(x-L/2,y-50,L,6,'#c0392b');R(x-L/2,y-10,L,6,'#4a4f66');
  for(let i=0;i<5;i++)R(x-L/2+14+i*32,y-40,22,18,'#bfe4ff');
  R(x-L/2-8,y-44,10,38,'#6a6f88');R(x-L/2-12,y-30,5,6,'#ffe066');
  for(let i=0;i<4;i++){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x-L/2+22+i*44,y-3,5,0,6.28);ctx.fill();}
  if(T.rider&&T.rider.riding){const r=T.rider,sx=r.x;r.x=x;sprUnit(r,y-50);r.x=sx;}
}
function drawTower(w){
  if(w.gone)return;const x=w.x,y=w.y;ctx.save();ctx.translate(x,y);ctx.scale(1.45,1.45);ctx.translate(-x,-y);
  if(w.dying>0){ctx.globalAlpha=Math.max(0,w.dying/.7);ctx.translate(x,y);ctx.scale(1,Math.max(.1,w.dying/.7));ctx.translate(-x,-y);}
  const f=w.flash>0;
  ctx.globalAlpha*=.3;R(x-20,y-2,40,5,'#000');ctx.globalAlpha=w.dying>0?Math.max(0,w.dying/.7):1;
  R(x-15,y-50,30,50,f?'#fff':'#7a7080');R(x-17,y-60,34,10,f?'#fff':'#6a6070');
  for(let i=0;i<4;i++)R(x-17+i*9,y-67,6,7,f?'#fff':'#6a6070');
  R(x-4,y-26,8,12,'#241a2e');R(x-10,y-42,4,6,'#241a2e');R(x+6,y-42,4,6,'#241a2e');
  R(x-1,y-84,2,18,'#4a3a2a');R(x+1,y-84,12,7,'#e4572e');
  ctx.restore();
  if(w.dying<=0){R(x-24,y-136,48,6,'#000');R(x-23,y-135,46*w.hp/w.max,4,'#e4572e');}
}
function drawCore(w){
  if(w.gone)return;const x=w.x-S.cam*0,y=w.y;ctx.save();ctx.translate(x,y);ctx.scale(1.2,1.2);ctx.translate(-x,-y);
  if(w.dying>0){ctx.globalAlpha=Math.max(0,w.dying/.7);}
  const f=w.flash>0,open=coreOpen();
  R(x-52,y-110,104,110,f?'#fff':'#6a5f78');R(x-60,y-124,120,14,f?'#fff':'#584e66');
  for(let i=0;i<6;i++)R(x-60+i*20,y-134,12,12,f?'#fff':'#584e66');
  R(x-18,y-52,36,52,'#1a1222');R(x-14,y-48,28,48,'#2e2438');
  R(x-40,y-90,10,14,'#241a2e');R(x+30,y-90,10,14,'#241a2e');
  R(x-2,y-176,3,44,'#4a3a2a');R(x+1,y-176,26,14,'#e4572e');
  if(open){ctx.strokeStyle='#ffd166';ctx.lineWidth=3;ctx.strokeRect(x-62,y-136,124,138);}
  ctx.restore();
  if(w.dying<=0){R(x-60,y-226,120,8,'#000');R(x-59,y-225,118*w.hp/w.max,6,'#e4572e');ctx.fillStyle='#ffd166';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('BENTENG DEPR',x,y-232);ctx.textAlign='left';}
}
function draw(){
  ctx.setTransform(SC,0,0,SC,0,-VY*SC);
  ctx.fillStyle='#0c0f14';ctx.fillRect(0,VY,VW,VH);
  if(!S)return;
  let sx=0,sy=0;if(S.shake>0){sx=rnd(-3,3)*S.shake*4;sy=rnd(-3,3)*S.shake*4;}
  ctx.save();ctx.translate(sx,sy);
  drawBG();
  ctx.translate(-S.cam,0);
  const objs=[];
  for(const u of S.units)if(!u.riding&&u.x>S.cam-60&&u.x<S.cam+VW+60)objs.push([u.y,0,u]);
  for(const T of S.trains)objs.push([T.y+1,3,T]);
  for(const k of NEWSK)if(S.news[k])objs.push([S.news[k].y,4,S.news[k]]);
  for(const w of S.towers)objs.push([w.y,1,w]);objs.push([S.core.y,2,S.core]);
  objs.sort((a,b)=>a[0]-b[0]||((a[2].team===0?a[2].x:-a[2].x)-(b[2].team===0?b[2].x:-b[2].x)));
  for(const [,k,o] of objs){if(k===4)drawNews(o);else if(k===3)drawTrain(o);else if(o.core)drawCore(o);else if(o.tower)drawTower(o);else drawUnit(o);}
  for(const p of S.proj){
    if(p.kind==='boulder'){ctx.fillStyle='#8a7a6a';ctx.beginPath();ctx.arc(p.x,p.y,5,0,6.28);ctx.fill();}
    else if(p.kind==='stone'){ctx.fillStyle='#9a9aa8';ctx.strokeStyle='#14141a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y-p.ay,3.2,0,6.28);ctx.fill();ctx.stroke();}
    else if(p.kind==='molotov'){const a=S.time*14;ctx.save();ctx.translate(p.x,p.y-p.ay);ctx.rotate(a);ctx.fillStyle='#3fae5a';ctx.fillRect(-2,-4,4,8);ctx.fillStyle='#ffe0a0';ctx.fillRect(-1,-6,2,2);ctx.restore();ctx.fillStyle='#ff7a1a';ctx.fillRect(p.x-2,p.y-p.ay-10+Math.sin(a)*1.5,4,5);ctx.fillStyle='#ffd24a';ctx.fillRect(p.x-1,p.y-p.ay-8,2,3);}
    else if(p.kind==='flash'){ctx.fillStyle='#fff';ctx.fillRect(Math.round(p.x-3),Math.round(p.y-3),6,6);ctx.fillStyle='#ffe066';ctx.fillRect(Math.round(p.x-1),Math.round(p.y-1),2,2);}
    else if(p.kind==='words'){ctx.fillStyle='#ff7a7a';ctx.font='bold 9px monospace';ctx.fillText('!!',p.x,p.y);}
    else{const t=p.t,dx=t.x-p.x,dy=(t.y-12)-p.y,d=Math.hypot(dx,dy)||1;ctx.strokeStyle=p.team===0?'#e8e0b0':'#ff9a6a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-dx/d*9,p.y-dy/d*9);ctx.stroke();}
  }
  for(const f of S.fx){
    if(f.ring){const k=1-f.life/f.max;ctx.globalAlpha=1-k;ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r*k,f.r*k*.45,0,0,6.28);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.text){ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.col;ctx.font='bold 13px monospace';ctx.fillText(f.text,f.x,f.y-(1-f.life/f.max)*20);ctx.globalAlpha=1;}
    else{ctx.globalAlpha=Math.max(0,f.life/f.max);R(f.x,f.y,3,3,f.col);ctx.globalAlpha=1;}
  }
  for(const t of S.texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.fillStyle=t.col;ctx.font='bold 11px monospace';ctx.fillText(t.t,t.x-8,t.y);ctx.globalAlpha=1;}
  ctx.restore();
  // penanda posisi benteng & garis bocor di minimap
  ctx.setTransform(SC,0,0,SC,0,-VY*SC);
  const mw=Math.min(VW-16,300),mx=8,my=WH-18;
  ctx.globalAlpha=.75;R(mx,my,mw,8,'#000');ctx.globalAlpha=1;
  for(const u of S.units){if(u.dying>0)continue;R(mx+u.x/WW*mw,my+1+u.lane*2,2,2,u.team===0?(u.hero?'#ffd166':'#6a8cff'):'#e4572e');}
  for(const w of S.towers)if(!w.gone)R(mx+w.x/WW*mw-1,my,3,8,'#ffd166');
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(mx+S.cam/WW*mw,my,VW/WW*mw,8);
  drawTV();
}

/* ---------- UI ---------- */
function buildLaneRow(){
  const r=$('rLane');r.innerHTML='';
  ['Atas','Tengah','Bawah'].forEach((n,i)=>{const b=document.createElement('button');b.className='lane'+(S&&S.lane===i?' on':'');b.innerHTML='<span class="tl">Jalur '+(i+1)+'</span><br><span class="small">'+n+'</span>';b.onclick=()=>setLane(i);r.appendChild(b);});
}
function iconOf(k){const A=ATL&&ATL[ART[k]];if(!A||!A.ok)return '';
  if(!A.ic){const f=A.f[A.i.idle],c=document.createElement('canvas');c.width=f[1];c.height=f[2];c.getContext('2d').drawImage(A.im,f[0],A.H-f[2],f[1],f[2],0,0,f[1],f[2]);A.ic=c.toDataURL();}
  return A.ic;}
function refreshIcons(){const pt=matchMedia('(orientation:portrait)').matches;[...UNITS.map(k=>['u_'+k,k]),...HEROES.map(k=>['h_'+k,k]),...NEWSK.map(k=>['n_'+k,k])].forEach(([id,k])=>{const b=$(id),u=pt?iconOf(k):'';if(b&&!pt){b.removeAttribute('style');}if(b&&u){const t=b.style;t.backgroundImage='url('+u+')';t.backgroundRepeat='no-repeat';t.backgroundPosition='center 5px';t.backgroundSize='auto 46%';t.display='flex';t.flexDirection='column';t.justifyContent='flex-end';t.alignItems='center';}});}
function buildUI(){
  buildLaneRow();
  const ru=$('rUnit');ru.innerHTML='';
  UNITS.forEach((k,i)=>{const d=DEF[k],b=document.createElement('button');b.id='u_'+k;b.innerHTML='<span class="tl">'+d.name+'</span><br>'+d.cost;b.onclick=()=>sendUnit(k);ru.appendChild(b);});
  const rh=$('rHero');rh.innerHTML='';
  HEROES.forEach(k=>{const d=DEF[k],b=document.createElement('button');b.className='hero';b.id='h_'+k;b.onclick=()=>heroAct(k);rh.appendChild(b);});
  const rn=$('rNews');rn.innerHTML='';
  NEWSK.forEach(k=>{const b=document.createElement('button');b.className='hero';b.id='n_'+k;b.onclick=()=>newsAct(k);rn.appendChild(b);});
  const rp=$('rUp');rp.innerHTML='';
  [['p','Pasukan'],['e','Ekonomi']].forEach(([w,n])=>{const b=document.createElement('button');b.id='up_'+w;b.onclick=()=>buyUp(w);rp.appendChild(b);});
  refreshIcons();uiRefresh(true);
}
addEventListener('resize',()=>{try{refreshIcons();}catch(e){}});
let uiT=0;
function uiRefresh(force){
  if(!S)return;
  $('gold').textContent=Math.floor(S.gold);
  $('lives').textContent='♥'+S.lives;
  $('coreI').style.transform='scaleX('+Math.max(0,S.core.hp/S.core.max)+')';
  $('wave').textContent='W'+(S.ew||0);
  UNITS.forEach(k=>{const b=$('u_'+k);if(b){b.disabled=S.gold<DEF[k].cost||S.ucd[k]>0;}});
  HEROES.forEach(k=>{const b=$('h_'+k),d=DEF[k],h=S.heroes[k];if(!b)return;
    let html;
    if(h&&!h.dying){html='<b>['+d.key+'] '+d.name+'</b>'+(S.skcd[k]>0?d.skill+' '+Math.ceil(S.skcd[k])+'d':d.skill+' SIAP');b.className='hero live';b.disabled=S.skcd[k]>0;}
    else{html='<b>['+d.key+'] '+d.name+'</b>'+(S.hcd[k]>0?'Pulih '+Math.ceil(S.hcd[k])+'d':'Panggil '+d.cost);b.className='hero';b.disabled=S.hcd[k]>0||S.gold<d.cost;}
    if(b.innerHTML!==html)b.innerHTML=html;
  });
  NEWSK.forEach(k=>{const b=$('n_'+k),d=NEWS[k],n=S.news[k];if(!b)return;let html;
    if(n){html='<b>['+d.key+'] '+d.name+'</b>'+d.skill+' '+Math.max(0,Math.ceil(n.cd))+'d';b.className='hero live';b.disabled=true;}
    else{html='<b>['+d.key+'] '+d.name+'</b>Panggil '+d.cost;b.className='hero';b.disabled=S.gold<d.cost;}
    if(b.innerHTML!==html)b.innerHTML=html;});
  const up=(w,n,lv,tbl)=>{const b=$('up_'+w);b.innerHTML='<span class="tl">'+n+' Lv'+lv+'</span><br>'+(lv>=tbl.length?'MAX':tbl[lv]);b.disabled=lv>=tbl.length||S.gold<tbl[lv];};
  up('p','Pasukan',S.plv,PUP);up('e','Ekonomi',S.elv,EUP);
  $('bCam').style.borderColor=S.follow?'#6bbf59':'';$('bPause').textContent=S.paused?'>':'||';$('bSpd').textContent='x'+S.speed;
}
function showOverlay(h){const o=$('overlay');o.innerHTML='<div class="box">'+h+'</div>';o.hidden=false;}
function hideOverlay(){$('overlay').hidden=true;}
function titleScreen(){
  let st='';for(let i=1;i<=STAGES.length;i++)st+='<button '+(i>best+1?'disabled':'')+' onclick="newGame('+i+')">'+i+'</button>';
  showOverlay('<h1>ATTACK<br>ON DEPR</h1><p>Serang satu arah: dari kiri ke kanan. Sisi kiri <b>tanpa pertahanan</b>, barikade <b>Poli</b> menjaga jalur di kanan.</p><p>Pejuang dan Pejuwati keluar otomatis tiap gelombang. Panggil hero, pakai skill, tembus barikade Poli tiap jalur lalu runtuhkan Benteng DEPR. Poli yang lolos ke kiri mengurangi nyawa. Awas boss <b>Bunda</b> (pajak) dan <b>Raja Jas</b> (kereta).</p><h2>PILIH STAGE</h2><div class="stg">'+st+'</div><p class="small">Q W E R = hero/skill | Z X C V = kirim pasukan | 1 2 3 = jalur | Spasi = jeda | panah = geser kamera</p>');
}
$('bPause').onclick=()=>{if(S){S.paused=!S.paused;uiRefresh();}};
$('bSpd').onclick=()=>{if(S){S.speed=S.speed===1?2:S.speed===2?3:1;uiRefresh();}};
$('bCam').onclick=()=>{if(S){S.follow=!S.follow;uiRefresh();}};
document.addEventListener('keydown',e=>{
  if(!S)return;const k=e.key.toLowerCase();initAudio();
  if(k==='q')heroAct('kangbewok');else if(k==='w')heroAct('rokigirang');else if(k==='e')heroAct('bimo');else if(k==='r')heroAct('retrobro');else if(k==='a')newsAct('reporter');else if(k==='s')newsAct('cameraman');
  else if(k==='z')sendUnit('prajurit');else if(k==='x')sendUnit('pemanah');
  else if(k==='1')setLane(0);else if(k==='2')setLane(1);else if(k==='3')setLane(2);
  else if(k===' '){S.paused=!S.paused;e.preventDefault();}
  else if(k==='arrowleft'){S.follow=false;S.cam-=60;}else if(k==='arrowright'){S.follow=false;S.cam+=60;}
  else if(k==='u')buyUp('p');else if(k==='i')buyUp('e');
});
cv.addEventListener('pointerdown',e=>{initAudio();camDrag={x:e.clientX,cam:S?S.cam:0,moved:false,x0:e.clientX,y0:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!camDrag||!S)return;const dx=e.clientX-camDrag.x;if(Math.abs(e.clientX-camDrag.x0)>6||Math.abs(e.clientY-camDrag.y0)>6)camDrag.moved=true;if(camDrag.moved){S.follow=false;S.cam=camDrag.cam-dx/(SC/ (Math.min(2,window.devicePixelRatio||1)));}});
cv.addEventListener('pointerup',e=>{
  if(camDrag&&!camDrag.moved&&S){const r=cv.getBoundingClientRect(),wy=VY+(e.clientY-r.top)/r.height*VH;let bl=0,bd=1e9;LANEY.forEach((y,i)=>{const d=Math.abs(y-wy);if(d<bd){bd=d;bl=i;}});if(wy>GYT-20)setLane(bl);}
  camDrag=null;uiRefresh();
});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S&&!S.paused&&!S.over){const n=S.speed;for(let i=0;i<n;i++)update(dt);}
  else if(S)camUpdate(dt);
  uiT-=dt;if(uiT<=0){uiT=.12;uiRefresh();}
  draw();requestAnimationFrame(frame);
}
resize();newGame(1);S.paused=true;titleScreen();
requestAnimationFrame(frame);
window.AOD={get S(){return S},update,newGame,heroAct,sendUnit,buyUp,setLane,castSkill,DEF,STAGES,resize,coreOpen,newsAct,NEWS};
</script>
