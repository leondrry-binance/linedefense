<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Attack on DEPR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#12161d;--panel:#1b222d;--line:#2e3948;--fg:#e9ecf1;--muted:#93a0b4;--gold:#f2c14e;--ours:#4a86e0;--foe:#e4572e;--go:#6bbf59;--accent:#58b4e8;--px:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;padding:max(4px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#app{height:100%;display:flex;flex-direction:column;gap:5px;min-height:0}
button{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:5px 6px;cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){border-color:var(--accent);transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
#hud{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;font:9px var(--px);white-space:nowrap}
#hud .g{color:var(--gold)}
#hud .lv{color:#ff6b6b;letter-spacing:1px}
#hud .sp{flex:1}
#hud button{font:9px var(--px);padding:5px 7px}
#core{flex:1;min-width:60px;height:12px;background:#0b0e13;border:2px solid #ff8a66;box-shadow:0 0 6px rgba(255,100,60,.5)}
#core i{display:block;height:100%;width:100%;background:var(--foe);transform-origin:left;transition:transform .15s}
#stage{position:relative;flex:1;min-height:120px;background:#0c0f14;border:2px solid var(--line)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000c;border:2px solid var(--line);padding:4px 9px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#ctl{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
@media(orientation:portrait){#rLane{display:none}#rUp{flex:0 0 auto;height:min(10vh,64px)}#rHero{flex:0 0 auto;height:min(24vh,150px)}#stage{flex:0 0 auto;height:min(96vw,62vh)}#ctl{flex:1;min-height:0}.row{flex:1;min-height:0}.row>button{font-size:11px}.row .tl{font-size:6.5px}.hero b{font-size:6px}}
.row{display:flex;gap:4px}
.row>button.ic{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background-repeat:no-repeat;background-position:center 5px;background-size:auto 46%}
.row>button{flex:1 1 0;min-width:0;overflow:hidden;font-size:10px;line-height:1.15;padding:5px 2px;text-align:center}
.row .tl{font:8px var(--px);letter-spacing:-.5px;white-space:nowrap}
.row>button.unit .tl,.row>button.unit .tl{font-size:6px!important;letter-spacing:-.4px;white-space:nowrap}
.lane.on{border-color:var(--gold);background:#2a2412}
.hero{position:relative;overflow:hidden}
.hero b{display:block;font:6px var(--px);letter-spacing:-.4px;white-space:normal;line-height:1.3;color:var(--gold);margin-bottom:2px}
.hero.live{border-color:#5fd18a}
.hero .cdv{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.small{color:var(--muted);font-size:9px}
#overlay{position:fixed;inset:0;background:rgba(8,10,14,.88);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;text-align:center}
#overlay .box{max-width:520px;width:100%;border:3px solid var(--line);background:var(--panel);padding:16px 14px}
#overlay h1{font:15px/1.5 var(--px);margin:0 0 6px;color:#ff6b3a;text-shadow:2px 2px 0 #000}
#overlay h2{font:11px/1.6 var(--px);margin:0 0 8px;color:var(--gold)}
#overlay p{margin:6px 0;color:#c8d0dc;font-size:12px;line-height:1.5}
#overlay button{font:10px var(--px);padding:9px 12px;white-space:nowrap;margin:4px 3px;border-color:var(--gold)}
.stg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.stg button{width:auto;min-width:44px;padding:10px 22px;font:11px var(--px);white-space:nowrap}
.stg button.cur{border-color:var(--gold);background:#2a2412}
.morale-status{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border:2px solid var(--line);background:var(--panel);text-align:center;cursor:default}
.morale-status strong{font-size:12px}.morale-status small{font-size:9px;color:var(--muted)}.morale-bar{display:block;height:5px;width:85%;background:#080c12}.morale-bar i{display:block;height:100%;transition:width .15s}
@media(orientation:portrait){.morale-status{gap:3px;padding:3px}.morale-status .tl{font-size:9px}.morale-status strong{font-size:12px}.morale-status small{font-size:10px}}
@media(orientation:landscape){
 #rLane{display:none}#ctl{gap:2px}#rHero{height:44px}#rUp{height:34px}
 #rNews{height:25px;min-height:25px;max-height:25px}
 #rNews>div{display:block;overflow:hidden;line-height:12px;font-size:10px!important;padding:0 3px;border:0;background:transparent}
 #rNews .hero b{display:inline;margin:0 5px 0 0;font-size:9px}
 #rUp .morale-status{padding:1px 3px;gap:0}
 #rUp .morale-status .tl{font-size:9px}#rUp .morale-status strong{font-size:11px}#rUp .morale-status small{font-size:8px}
 #rUp .morale-bar{height:3px}
 #hud,#hud button{font-size:11px}
 .row>button{font-size:12px;padding:3px 2px}.row .tl{font-size:10px}
 .hero b{font-size:clamp(8px,.85vw,11px)}.row>button.unit .tl{font-size:10px!important}
 .morale-status{gap:1px;padding:3px}.morale-status .tl{font-size:10px}
 .morale-status strong{font-size:12px}.morale-status small{font-size:9px}.morale-bar{height:4px}
}
</style>
</head>
<body>
<div id="app">
 <div id="hud">
  <span class="lv" id="lives"></span>
  <span class="g" id="gold">0</span>
  <span id="wave">W0</span>
  <div id="core"><i id="coreI"></i></div>
  <button id="bSpd">x1</button><button id="bCam">CAM</button><button id="bPause">||</button>
 </div>
 <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="overlay"></div></div>
 <div id="ctl">
  <div class="row" id="rLane"></div>
  <div class="row" id="rUnit"></div>
  <div class="row" id="rHero"></div>
  <div class="row" id="rNews"></div>
  <div class="row" id="rUp"></div>
 </div>
</div>

function spendDefenseReserve(reason,count){

        car.cargo.forEach((u,i)=>{camFocus(car.x-60,1.6);u.riding=false;u.atk=0;u.oy=rnd(-20,20);u.x=clamp(car.x-20-i*24-rnd(0,30),4,WW-4);u.y=LANEY[u.lane]+u.oy;});sfx('spawn');}

function camUpdate(dt){

  if(S.follow&&!camDrag){
    const att=S.units.filter(u=>u.team===0&&!u.dying&&!u.riding).sort((a,b)=>b.x-a.x);
    const front=att.slice(0,3);
    const lead=front.length?front.reduce((a,u)=>a+u.x,0)/front.length:0;
    // musuh terdekat di depan pasukan = titik kontak
    let foe=null,fd=1e9;
    for(const o of S.units){if(o.team!==1||o.dying>0||o.d.boss&&false)continue;const d=o.x-lead;if(d>-80&&d<fd){fd=d;foe=o;}}
    let tx=lead,rate=2.5,bias=.38;
    if(foe&&fd<520){ // sedang bertempur: bingkai dua sisi, geser lebih cepat
      tx=lead+(foe.x-lead)*.55;bias=.5;rate=4.5;
      const nb=S.units.filter(u=>u.team===1&&!u.dying&&Math.abs(u.x-foe.x)<260).length;if(nb>=5)rate=5.5;
    }

    const want=clamp(tx-VW*bias,0,WW-VW);
    const far=Math.abs(want-S.cam)>VW*.6?1.8:1;
    S.cam+=(want-S.cam)*Math.min(1,dt*rate*far);

}
addEventListener('resize',()=>{try{refreshIcons();}catch(e){}});
let uiT=0;
function uiRefresh(force){
  if(!S)return;
  $('gold').textContent=Math.floor(S.gold);
  $('lives').textContent='♥'+S.lives;
  $('coreI').style.transform='scaleX('+Math.max(0,S.core.hp/S.core.max)+')';
  $('wave').textContent='W'+(S.ew||0);
  UNITS.forEach(k=>{const b=$('u_'+k);if(!b)return;const cook=k==='pemanah'?selectCook():null;
    if(cook){b.innerHTML='<span class="tl">Pejuwati</span><br>'+(cook.kitchenTime>0?'Dapur '+Math.ceil(cook.kitchenTime)+'d · TAP sisa!':cook.kitchenCooldown>0?'Pulih '+Math.ceil(cook.kitchenCooldown)+'d':'Dapur SIAP');b.disabled=cook.kitchenTime>0?(cook.foodCooldown||0)>0:(cook.kitchenCooldown||0)>0;}
    else if(k==='prajurit'&&S.cars.some(c=>!c.dead)){b.innerHTML='<span class="tl">Pejuang</span><br>TAP kombo melee';b.disabled=false;}
    else{b.innerHTML='<span class="tl">'+DEF[k].name+'</span><br>'+DEF[k].cost;b.disabled=S.gold<DEF[k].cost||S.ucd[k]>0;}
  });
  HEROES.forEach(k=>{const b=$('h_'+k),d=DEF[k],h=S.heroes[k];if(!b)return;
    let html;
    if(h&&!h.dying&&k==='kangbewok'&&S.rallyTime>0){html='<b>['+d.key+'] '+d.name+'</b>TAP orasi | +'+(h.rallyPower||0)+'% | '+Math.ceil(S.rallyTime)+'d';b.className='hero live';b.disabled=h.stun>0||h.smokePanic>0;}
    else if(h&&!h.dying&&k==='rokigirang'&&((h.wordWindow||0)>0||(h.wordQueued||0)>0)){html='<b>['+d.key+'] '+d.name+'</b>TAP umpatan | '+(h.wordQueued||0)+' kata';b.className='hero live';b.disabled=h.stun>0||h.smokePanic>0;}
    else if(h&&!h.dying){html='<b>['+d.key+'] '+d.name+'</b>'+(S.skcd[k]>0?d.skill+' '+Math.ceil(S.skcd[k])+'d':d.skill+' SIAP');b.className='hero live';b.disabled=S.skcd[k]>0;}
    else{html='<b>['+d.key+'] '+d.name+'</b>'+(S.hcd[k]>0?'Pulih '+Math.ceil(S.hcd[k])+'d':'Hadir otomatis');b.className='hero';b.disabled=true;}
    if(b.innerHTML!==html)b.innerHTML=html;
  });
  NEWSK.forEach(k=>{const b=$('n_'+k),d=NEWS[k],n=S.news[k];if(!b)return;let html;
    if(n){html='<b>['+d.key+'] '+d.name+'</b>'+d.skill+' '+Math.max(0,Math.ceil(n.cd))+'d';b.className='hero live';b.disabled=true;}
    else if(S.ncd[k]>0){html='<b>['+d.key+'] '+d.name+'</b>Kembali otomatis '+Math.ceil(S.ncd[k])+'d';b.className='hero';b.disabled=true;}
    else{html='<b>['+d.key+'] '+d.name+'</b>Segera meliput otomatis';b.className='hero';b.disabled=false;}
    if(b.innerHTML!==html)b.innerHTML=html;});
  [['p','Demo Morals',0],['e','DEPR Morals',1]].forEach(([w,label,team])=>{
    const value=S.morale[team],b=$('up_'+w);
    b.innerHTML='<span class="tl">'+label+'</span><strong>'+value+' / 100</strong><span class="morale-bar"><i style="width:'+value+'%;background:'+(team===0?'var(--ours)':'var(--foe)')+'"></i></span><small>Dorongan '+moralePush(team).toFixed(2)+'×'+(team===0&&S.debtTime>0?' | DMG 75%':'')+(team===1&&outageBenefit(1)?' | brutal '+factionAttackScale(1).toFixed(2)+'×':'')+'</small>';
    if(team===1){const detail=b.querySelector?b.querySelector('small'):null;if(detail)detail.textContent=S.capture?'Pertahanan ditaklukkan':(S.defenseCooldown>0?'Cadangan '+Math.ceil(S.defenseCooldown)+'d':'Cadangan butuh moral 65')+(outageBenefit(1)?' | brutal '+factionAttackScale(1).toFixed(2)+'×':'');}
    b.setAttribute('title','Selisih moral: bonus serangan '+Math.round((moraleAttackMultiplier(team)-1)*100)+'%');
  });
  $('bCam').textContent=S.follow?'CAM ON':'CAM OFF';$('bCam').setAttribute('aria-pressed',String(S.follow));$('bCam').style.borderColor=S.follow?'#6bbf59':'';$('bPause').textContent=S.paused?'>':'||';$('bSpd').textContent='x'+S.speed;
  if(S.capture)document.querySelectorAll('#ctl button').forEach(b=>b.disabled=true);
}
function showOverlay(h){const o=$('overlay');o.innerHTML='<div class="box">'+h+'</div>';o.hidden=false;}
function hideOverlay(){$('overlay').hidden=true;}
function titleScreen(){
  let st='<button onclick="newGame(5)">MULAI</button>';
  showOverlay('<h1>ATTACK<br>ON DEPR</h1><p>Serang satu arah: dari kiri ke kanan. Sisi kiri <b>tanpa pertahanan</b>, barikade <b>Poli</b> menjaga jalur di kanan.</p><p>Pejuang dan Pejuwati keluar otomatis tiap gelombang. Tap Pejuwati untuk dapur 16 detik; tap lagi melempar sisa makanan. Bewok memberi semangat, Bimo/Godai memimpin lempar batu dan molotov. Panggil hero, pakai skill, tembus barikade Poli lalu runtuhkan Gedung DEPR. Poli yang lolos ke kiri mengurangi nyawa. Awas bom asap dan water cannon Poli. Awas boss <b>Ratu Pajak</b> (PPN 12%) dan <b>Raja Jawa</b> (kereta).</p><h2>SIAP?</h2><div class="stg">'+st+'</div><p class="small">Q W E R = hero/skill | Z X C V = kirim pasukan | Spasi = jeda | panah = geser kamera</p>');
}
$('bPause').onclick=()=>{if(S){S.paused=!S.paused;uiRefresh();}};
$('bSpd').onclick=()=>{if(S){S.speed=S.speed===1?2:S.speed===2?3:1;uiRefresh();}};
$('bCam').onclick=()=>{if(S){S.follow=!S.follow;uiRefresh();}};
document.addEventListener('keydown',e=>{
  if(!S)return;const k=e.key.toLowerCase();initAudio();
  if(k==='q')heroAct('kangbewok');else if(k==='w')heroAct('rokigirang');else if(k==='e')heroAct('bimo');else if(k==='r')heroAct('retrobro');
  else if(k==='z')sendUnit('prajurit');else if(k==='x')sendUnit('pemanah');
  
  else if(k===' '){S.paused=!S.paused;e.preventDefault();}
  else if(k==='arrowleft'){S.follow=false;S.cam-=60;}else if(k==='arrowright'){S.follow=false;S.cam+=60;}

});
cv.addEventListener('pointerdown',e=>{initAudio();camDrag={x:e.clientX,cam:S?S.cam:0,moved:false,x0:e.clientX,y0:e.clientY,vy:VY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!camDrag||!S)return;const dx=e.clientX-camDrag.x;if(Math.abs(e.clientX-camDrag.x0)>6||Math.abs(e.clientY-camDrag.y0)>6)camDrag.moved=true;if(camDrag.moved){S.follow=false;S.cam=camDrag.cam-dx/(SC/ (Math.min(2,window.devicePixelRatio||1)));if(!matchMedia('(orientation:portrait)').matches)VY=clamp(camDrag.vy-(e.clientY-camDrag.y0)/(SC/Math.min(2,window.devicePixelRatio||1)),0,Math.max(0,WH-VH));}});
cv.addEventListener('pointerup',e=>{
  if(camDrag&&!camDrag.moved&&S){const r=cv.getBoundingClientRect(),wy=VY+(e.clientY-r.top)/r.height*VH;let bl=0,bd=1e9;LANEY.forEach((y,i)=>{const d=Math.abs(y-wy);if(d<bd){bd=d;bl=i;}});}
  camDrag=null;uiRefresh();
});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S&&!S.paused&&(!S.over||(S.capture&&!S.capture.done))){const n=S.speed;for(let i=0;i<n;i++)update(dt);}
  else if(S&&!S.capture)camUpdate(dt);
  uiT-=dt;if(uiT<=0){uiT=.12;uiRefresh();}
  draw();requestAnimationFrame(frame);
}
resize();newGame(5);S.paused=true;titleScreen();
requestAnimationFrame(frame);
window.AOD={get S(){return S},update,newGame,heroAct,sendUnit,buyUp,setLane,castSkill,DEF,STAGES,resize,coreOpen,newsAct,NEWS,callUpdate};
</script>
