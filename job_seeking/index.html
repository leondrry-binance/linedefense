// ===== Perjalanan =====
function dist(a,b){return Math.hypot(LOC[a].x-LOC[b].x,LOC[a].y-LOC[b].y);}
function baseMin(a,b){return 8+Math.round(dist(a,b)*0.2);}
function isRush(m){const h=m/60;return (h>=6&&h<9.5)||(h>=16&&h<19.5);}
function startTrip(to,mode){
  S.money-=mode==='mobil'?15000:mode==='motor'?5000:8000;
  const bm=baseMin(S.at,to);trip={from:S.at,to:to,mode:mode,t:0,base:bm,extra:0,done:false,adur:Math.min(120,Math.max(60,Math.round(50+bm*.9+rnd(26))))};selDest=-1;scene='trip';
}
function resolveTrip(){
  if(trip.mode==='mobil'){
    if(Math.random()<(isRush(S.min)?.5:.15)){
      const ex=15+rnd(20);
      show({k:'macet'},'Macet di depan. Di dalam mobil ber-AC kamu tetap tenang, memutar lagu sambil menunggu. Telat sekitar '+ex+' menit.',[{l:'Sabar, nyetel musik',f:()=>tripPolice(ex,false)}]);
      return;
    }
    tripPolice(0,false);return;
  }
  if(trip.mode==='motor'){
    if(Math.random()<(isRush(S.min)?.65:.25)){
      const ex=20+rnd(30);
      show({k:'macet'},'Macet parah! Klakson di mana-mana. Kalau sabar, kira-kira telat '+ex+' menit.\nAtau lewat jalan tikus: lebih cepat, tapi bisa kena razia.',[
        {l:'Sabar menunggu',f:()=>tripPolice(ex,false)},
        {l:'Lewat jalan tikus',f:()=>tripPolice(Math.round(ex/2),Math.random()<.4)}]);
      return;
    }
    tripPolice(0,Math.random()<.22);
  }else tripPolice(rnd(12),false);
}
function tripPolice(ex,police){trip.extra+=ex;if(police)policeStop(finishTrip);else finishTrip();}
function policeStop(next){
  const miss=[];if(!S.sim)miss.push('SIM');if(!S.stnk)miss.push('STNK (pajak mati)');
  if(!miss.length){
    show({k:'tilang'},'Polisi menyetop dan memeriksa surat-surat. SIM dan STNK lengkap. "Silakan lanjut, Mas."\nKamu lega. (+10 menit)',[{l:'Lanjut jalan',f:()=>{trip.extra+=10;next();}}]);return;
  }
  const fine=(S.sim?0:150000)+(S.stnk?0:100000);
  show({k:'tilang'},'"Permisi, Mas. Surat-suratnya mana?" Kamu tidak punya '+miss.join(' & ')+'.\nDenda tilang: '+rp(fine)+'.',[
    {l:'Bayar denda '+rp(fine),f:()=>{if(S.money>=fine){S.money-=fine;trip.extra+=20;next();}else seized(next);}},
    {l:'Aku tidak punya uang...',f:()=>seized(next)}]);
}
function seized(next){
  S.motor=false;trip.mode='angkot';
  show({k:'tilang'},'Uangmu tidak cukup. Motor ditahan polisi. Tebus di Samsat (Rp 100rb) kalau sudah punya uang. Kamu melanjutkan dengan angkot.',[{l:'Lanjut',f:()=>{trip.extra+=40;next();}}]);
}
function finishTrip(){
  const dur=(trip.mode==='angkot'?trip.adur:trip.base)+trip.extra;
  drain(trip.mode==='mobil'?1:trip.mode==='motor'?5:12);
  if(advance(dur))return;
  S.at=trip.to;arrived();
}

  const h=S.min/60;const k=LOC[lo].k;if(k==='mart')return true;const r=k==='fc'||k==='warteg'?[7,21]:k==='samsat'?[8,15]:k==='dealer'?[9,18]:[8,17];

// ===== Ditagih =====
function pickCollector(){
  for(const b of S.bills){
    if(b.paid||S.day<=b.due||(b.hold&&S.day<=b.hold))continue;
    const p=b.k==='warteg'?.5:b.k==='tetangga'?(b.late<=1?1:.5):b.k==='pinjol'?.6:b.k==='kos'?.4:b.k==='motor'?.35:b.k==='mobil'?.35:b.k==='kartu'?.4:b.k==='rumah'?.3:0;
    if(p&&Math.random()<p)return b;
  }
  return null;
}
function collectScene(b,msg){
  const who=(b.k==='kartu'||b.k==='pinjol'||b.k==='motor'||b.k==='mobil'||b.k==='rumah')?'dc':(b.k==='kos'||b.k==='warteg')?'kos':'tet';
  const line=who==='dc'?'Pintumu digedor keras. Debt collector '+(b.k==='motor'||b.k==='mobil'?'leasing':b.k==='rumah'||b.k==='kartu'?'bank':'pinjol')+' berdiri di depan: "Tagihan '+rp(b.amt)+' sudah telat! Mau bayar atau kami bawa barangmu?"'
    :b.k==='warteg'?'Ibu warteg datang ke kosmu: "Mas, utang makan '+rp(b.amt)+' kapan dibayar? Jangan lupa ya."'
    :who==='kos'?'Ibu kos mengetuk pintu: "Nak, '+b.n+' '+rp(b.amt)+' kapan dibayar? Sudah telat ya."'
    :'Tetanggamu mengetuk pintu: "Mas, utang '+rp(b.amt)+' yang kemarin kapan dibayar? Katanya cuma sebentar."';
  const done=m=>{homeMenu(msg+'\n'+m);};
  const dc=who==='dc';
  show({k:'door',who:who},line,[
    {l:'Bayar penuh '+rp(b.amt),off:S.money<b.amt,f:()=>{S.money-=b.amt;b.paid=true;let m=b.n+' lunas.';if(b.k==='motor'&&S.leasing){S.leasing=false;S.motor=true;m+=' Motor dikembalikan.';}done(m);}},
    {l:'Bayar separuh',off:S.money<Math.ceil(b.amt/2),f:()=>{const h=Math.ceil(b.amt/2/1000)*1000;S.money-=h;b.amt-=h;if(b.amt<=0)b.paid=true;done('Kamu membayar '+rp(h)+'. Sisa '+rp(Math.max(0,b.amt))+'. Dia pergi sambil menggerutu.');}},
    {l:'Marah-marah, konfrontasi',f:()=>{
      const r=Math.random();let m;
      if(dc){
        if(r<.15)m='Kamu membentak balik. Debt collector kaget dan pergi, tapi dia akan kembali.';
        else if(r<.55){S.energy=Math.min(S.energy,35);S.money=Math.max(0,S.money-100000);S.conf=Math.max(0,S.conf-1);m='Kamu dipukul sampai jatuh dan dompetmu dirampas (-Rp 100rb). Badanmu remuk.';}
        else if(b.k==='motor'&&S.motor){S.motor=false;S.leasing=true;S.conf=Math.max(0,S.conf-1);m='Dua orang lagi muncul. Motormu langsung ditarik di depan mata tetangga.';}
        else{S.conf=Math.max(0,S.conf-2);S.energy=Math.min(S.energy,50);m='Fotomu dan KTP-mu disebar ke grup WhatsApp keluarga. Kamu malu setengah mati.';}
      }else{
        if(r<.35){S.conf=Math.max(0,S.conf-1);m='Dia mundur sambil bergumam. Tapi satu gang jadi tahu kelakuanmu.';}
        else if(r<.75){S.conf=Math.max(0,S.conf-2);S.energy=Math.min(S.energy,70);m='Adu mulut sengit. Warga ramai menonton dan ketua RT turun tangan. Kamu malu.';}
        else{S.energy=Math.min(S.energy,40);S.money=Math.max(0,S.money-80000);S.conf=Math.max(0,S.conf-2);m='Baku hantam. Kamu babak belur dan harus berobat (-Rp 80rb). Satu kampung membicarakanmu.';}
      }
      if(advance(30))return;done(m);}},
    {l:'Hajar dia!',off:who==='kos',f:()=>{
      startFight({who:dc?'dc':'tet',bg:'door',hp:dc?10:5,windT:dc?.6:.8,onEnd:won=>{
        let m;
        if(won){if(dc){b.hold=S.day+2;m='Debt collector kabur terbirit-birit dan tidak berani datang 2 hari. Tagihan tetap ada.';}
          else{b.paid=true;S.conf=Math.max(0,S.conf-1);m='Tetanggamu ketakutan dan tidak berani menagih lagi. Utangnya hangus, tapi satu gang jadi takut padamu.';}}
        else{S.energy=Math.min(S.energy,20);S.money=Math.max(0,S.money-120000);S.conf=Math.max(0,S.conf-1);b.amt=Math.round(b.amt*1.1/1000)*1000;m='Kamu KO. Saat sadar, dompetmu berkurang '+rp(120000)+' dan tagihan naik 10%.';}
        if(S.evil>=5)return premanEnd();
        done(m);}});}},
    {l:'Sembunyi di kamar',f:()=>{
      if(advance(90))return;
      if(Math.random()<.5)return done('Kamu menahan napas di kamar sampai dia pergi. Aman, tapi sudah buang 90 menit.');
      b.amt=Math.round(b.amt*1.08/1000)*1000;S.conf=Math.max(0,S.conf-1);if(dc)S.energy=Math.min(S.energy,60);
      done('Ketahuan! "Motornya ada di depan, Mas!" Dia makin marah, tagihan naik 8%.');}},
    {l:b.tempo?'Tempo sudah dipakai':'Minta tempo sampai besok',off:b.tempo,f:()=>{
      b.tempo=true;if(Math.random()<.5){b.due=S.day+1;done('Dia setuju memberi waktu sampai besok, dengan wajah masam.');}else{b.amt=Math.round(b.amt*1.05/1000)*1000;done('Ditolak: "Dari kemarin janji terus!" Ada tambahan biaya 5%.');}}}
  ]);
}
function loanMenu(t){
  const bad=S.bills.some(b=>!b.paid&&b.k==='tetangga');
  const ask=(amt,p)=>{
    if(bad)return loanMenu('Tetangga: "Yang kemarin saja belum dibayar." Kamu tidak enak hati.');
    if(advance(30))return;
    const pp=p-(S.life==='hard'?.1:0);
    if(Math.random()<pp){S.money+=amt;S.bills.push(mkBill('tetangga',amt,S.day+(S.life==='hard'?3:5)));moreMenu('Tetangga meminjamimu '+rp(amt)+'. Janji kembali dalam '+(S.life==='hard'?3:5)+' hari.');}
    else moreMenu('Ditolak halus: "Lagi susah juga, Mas." Kamu pulang dengan canggung.');
  };
  show({k:'home'},t||'Pinjam uang ke tetangga? Gratis bunga, tapi kalau telat ditagih dan jadi omongan satu gang.',[
    {l:'Pinjam Rp 100rb',f:()=>ask(100000,.9)},{l:'Pinjam Rp 300rb',f:()=>ask(300000,.65)},{l:'Pinjam Rp 500rb',f:()=>ask(500000,.4)},{l:'Kembali',f:()=>moreMenu()}]);
}

  show({k:'home'},b.n+': '+rp(b.amt)+'\nJatuh tempo hari ke-'+b.due+(S.day>b.due?' (sudah TELAT '+b.late+' hari)':'')+'\nUangmu: '+rp(S.money),[
    {l:'Bayar sekarang',f:()=>{
      if(S.money<b.amt)return billsMenu('Uangmu tidak cukup untuk '+b.n+'.');
      S.money-=b.amt;b.paid=true;let m=b.n+' lunas.';
      if(b.k==='motor'&&S.leasing){S.leasing=false;S.motor=true;m+=' Motormu dikembalikan.';}
      billsMenu(m);}},
    {l:b.tempo?'Tempo sudah dipakai':'Minta tempo 3 hari',off:b.tempo,f:()=>{
      b.tempo=true;
      if(Math.random()<(b.k==='pinjol'?.3:.55)){b.due+=3;billsMenu('Permintaan tempo disetujui. Jatuh tempo mundur 3 hari.');}
      else{b.amt=Math.round(b.amt*1.05/1000)*1000;billsMenu('Ditolak. "Bayar sekarang, Pak." Ada biaya admin 5%.');}}},
    {l:'Kembali',f:()=>billsMenu()}]);
}

function karma(){const k=S.evil+S.crime;return k===0?'Orang baik-baik':k<4?'Abu-abu':'Berbahaya';}
function parkirLiar(){
  if(S.energy<25||S.min>=19*60)return gigMenu('Terlalu capek atau sudah terlalu malam.');
  S.crime++;S.energy-=20;if(advance(180))return;
  const r=Math.random()+S.crime*.06+(S.record?.1:0);
  if(r<.5){const g=60000+rnd(90000);S.money+=g;S.hustle++;return moreMenu('Kamu pakai rompi oranye dan meniup peluit di depan minimarket. Dapat '+rp(g)+'. Tidak ada yang protes.');}
  if(r<.7)return moreMenu('Tukang parkir asli dan preman setempat mengusirmu: "Ini wilayah kami!" Kamu pulang tanpa hasil.');
  if(r<.85){S.conf=Math.max(0,S.conf-1);return show({k:'tilang'},'Razia Dinsos dan Satpol PP! Kamu diangkut ke panti sosial dan baru dilepas besok pagi.',[{l:'Lanjut',f:()=>nextDay(false)}]);}
  if(r<1){
    const fine=200000;
    return show({k:'tilang'},'Warga melapor. Polisi memeriksamu karena pungli parkir liar. Denda damai '+rp(fine)+'.',[
      {l:S.money>=fine?'Bayar denda':'Tidak punya uang (ditahan semalam)',f:()=>{if(S.money>=fine){S.money-=fine;moreMenu('Kamu membayar denda dan diperingatkan keras. Catatan polisi bertambah.');}else nextDay(true);}}]);
  }
  goJail(5+rnd(4));
}
function goJail(d){
  S.jail++;S.record=true;S.apps={};const news=[];let go=null;
  for(let i=0;i<d&&!go;i++){S.day++;go=tickBills(news);}
  S.min=450;S.energy=70;S.at=0;S.conf=Math.max(0,S.conf-2);
  if(go||S.money<0||S.jail>=3){
    clearSave();hasSave=false;
    return show({k:'lose'},S.jail>=3?'Tiga kali masuk penjara. Hidupmu berputar antara sel dan jalanan. Level 1 gagal.':(go||'Keluar penjara, kamu tidak punya apa-apa lagi. Level 1 gagal.'),[{l:'Coba lagi',f:()=>{scene='title';}}]);
  }
  show({k:'lose'},'Kamu ditahan '+d+' hari di sel dan tidak bisa melamar apa pun. Semua lamaranmu hangus dan SKCK-mu tercoreng.',[{l:'Pulang',f:()=>homeMenu('Hari ke-'+S.day+'. Kamu baru bebas. Perusahaan besar akan menolakmu karena SKCK.')}]);
}
function gigMenu(t){
  const ok=S.min<20*60&&S.energy>=30;
  show({k:'home'},t||'Cari uang tambahan. Butuh energi minimal 30 dan harus sebelum jam 20:00.\nUangmu: '+rp(S.money),[
    {l:'Ojol (mitra aplikasi)',off:S.min>=22*60,f:()=>ojolMenu()},
    {l:'Serabutan (+Rp 80rb)',off:!ok,f:()=>{S.money+=80000;S.hustle++;S.energy-=30;if(advance(240))return;moreMenu('Kerja serabutan empat jam, dapat '+rp(80000)+'.');}},
    {l:'Parkir liar (gelap)',off:!ok,f:parkirLiar},
    {l:'Jual HP lama (+Rp 150rb)',off:S.sold,f:()=>{S.sold=true;S.money+=150000;if(advance(60))return;moreMenu('HP lamamu laku '+rp(150000)+'. Hanya bisa sekali.');}},
    {l:'Kembali',f:()=>moreMenu()}]);
}
function practice(){
  if(S.energy<15)return moreMenu('Kamu terlalu capek untuk latihan.');
  S.conf=Math.min(6,S.conf+1);S.energy-=15;if(advance(60))return;
  moreMenu('Kamu latihan menjawab di depan cermin selama sejam. Percaya dirimu naik ('+S.conf+'/6). Jawaban jelas, sopan, dan jujur lebih disukai.');
}
function sleep(){
  if(S.min<18*60&&S.energy>=40)return homeMenu('Belum ngantuk. Masih siang, sayang kalau dipakai tidur.');
  show({k:'night'},'Zzz... Besok harus lebih semangat.',[{l:'Bangun pagi',f:()=>nextDay(false)}]);
}
function tickBills(news){
  let go=null,teror=false;
  for(const b of S.bills){
    if(b.paid||S.day<b.due)continue;
    if(S.day===b.due){news.push(b.n+' jatuh tempo hari ini ('+rp(b.amt)+').');continue;}
    b.late++;
    if(b.late===1){b.amt=Math.round(b.amt*1.1/1000)*1000;news.push(b.n+' menunggak, kena denda 10%.');}
    if(b.k==='pinjol'){b.amt=Math.round(b.amt*1.06/1000)*1000;S.conf=Math.max(0,S.conf-1);S.energy=Math.min(S.energy,80);if(!teror){teror=true;news.push('Debt collector pinjol meneror lewat telepon dan menghubungi keluargamu.');}}
    else if(b.k==='kartu'&&b.late>=5){S.cc=null;S.blacklist=true;b.paid=true;S.conf=Math.max(0,S.conf-1);S.sAdd=(S.sAdd||0)+8;news.push('Kartu kreditmu diblokir dan namamu masuk BI Checking. Kini kamu tidak bisa lagi mengajukan kredit.');}
    else if(b.k==='mobil'&&b.late>=3&&S.car){S.car=false;b.paid=true;b.rec=0;S.sAdd=(S.sAdd||0)+8;news.push('Debt collector leasing menarik mobilmu! DP hangus.');}
    else if(b.k==='rumah'&&b.late>=4&&S.house){S.house=false;b.paid=true;b.rec=0;S.sAdd=(S.sAdd||0)+12;news.push('Bank menyita rumahmu karena cicilan macet. DP hangus, kamu kembali ke kos.');}
    else if(b.k==='motor'&&b.late>=3&&S.motor){S.motor=false;S.leasing=true;news.push('Debt collector leasing menarik motormu!');}
    else if(b.k==='kos'&&b.late>3)go='Kamu diusir dari kos karena menunggak. Barangmu dikeluarkan ke jalan.';
    else if((b.k==='hamil'||b.k==='sekolah'||b.k==='sakit')&&b.late===1){S.energy=Math.min(S.energy,85);news.push('Kamu sulit tidur memikirkan '+b.n+'.');}
  }
  return go;
}
function nextDay(forced){
  for(const b of S.bills.slice())if(b.paid&&b.rec&&!b.renewed){b.renewed=true;S.bills.push(Object.assign(mkBill(b.k,b.base,b.due+b.rec),{rec:b.rec,base:b.base}));}
  const e0=S.energy;S.day++;S.min=450;let gain=S.hunger<40?100:S.hunger<70?60:S.hunger<85?30:10;if(S.sick>0)gain=Math.round(gain*.5);if(S.house)gain+=10;S.energy=Math.min(forced?55:100,S.energy+gain);S.hunger=Math.min(100,S.hunger+15);S.money-=S.daily;S.at=0;
  const news=[];
  for(const id in S.apps){
    const a=S.apps[id],job=JOBS.find(j=>j.id===id);
    if(a.st==='wait'&&S.day>=a.decide){
      if(a.pass){a.st='invite';a.invDay=S.day+rnd(2);a.invMin=(job.tier===2?9:10)*60;S.unread++;news.push('Undangan interview '+job.name+': hari ke-'+a.invDay+' jam '+clk(a.invMin)+'.');}
      else{a.st='rej';a.cool=S.day+3;S.sAdd=(S.sAdd||0)+6;S.unread++;news.push('Lamaran di '+job.name+' belum bisa dilanjutkan.');}
    }
    if(a.st==='invite'&&S.day>a.invDay){a.st='rej';a.cool=S.day+3;news.push('Jadwal interview '+job.name+' terlewat.');}
    if(a.st==='rej'&&a.cool&&S.day>=a.cool)delete S.apps[id];
  }
  let go=tickBills(news);
  if(go||S.money<0){clearSave();hasSave=false;show({k:'lose'},go||('Uangmu habis di hari ke-'+S.day+'. Kamu terpaksa pulang kampung. Level 1 gagal.'),[{l:'Coba lagi',f:()=>{scene='title';}}]);return;}
  if(S.hunger>=70)news.push('Kamu bangun dengan perut lapar dan badan lemas, tidurmu tidak memulihkan tenaga.');
  const od=S.bills.filter(b=>!b.paid&&b.late>0).length;
  S.stress=Math.min(100,Math.round((S.stress||0)*(S.house?.6:.7)+od*8+(S.hunger>=70?5:0)+(S.sick>0?5:0)+(S.sAdd||0)));S.sAdd=0;
  if(S.stress>=60)news.push('Pikiranmu penuh, semua terasa berat dan cepat melelahkan.');
  if(S.sick>0){S.sick--;if(S.sick<=0){S.sickK=null;news.push('Badanmu sudah pulih dari sakit.');}else news.push('Kamu masih '+S.sickK+'. Sisa sekitar '+S.sick+' hari, energi pulih lebih lambat.');}
  else if((e0<=10&&Math.random()<.6)||(e0<=25&&Math.random()<.2+S.stress/300)){S.sick=3+rnd(3);S.sickK=['flu','demam','batuk-batuk'][rnd(3)];news.push('Karena terlalu lelah, kamu jatuh sakit: '+S.sickK+'. Beli obat di minimarket atau istirahat.');}
  const msg='Hari ke-'+S.day+'. Biaya hidup hari ini '+rp(S.daily)+'.'+(news.length?'\n'+news.join(' '):'');
  const cb=pickCollector();
  if(cb)collectScene(cb,msg);else homeMenu(msg);
}
function inbox(){
  S.unread=0;const ls=[];
  for(const id in S.apps){const a=S.apps[id],job=JOBS.find(j=>j.id===id);
    ls.push(job.name+': '+(a.st==='ban'?'daftar hitam':a.st==='wait'?'menunggu balasan':a.st==='invite'?'UNDANGAN hari ke-'+a.invDay+', jam '+clk(a.invMin):'tidak lolos'));}
  show({k:'home'},ls.length?'Kotak masuk:\n'+ls.join('\n'):'Belum ada lamaran yang dikirim.',[{l:'Kembali',f:()=>homeMenu()}]);
}

  show({k:'home'},'Lowongan tersedia. Makin besar perusahaannya, makin panjang dan sulit seleksinya.',ops);
}
function stText(job){const a=S.apps[job.id];if(!a)return 'belum melamar';return a.st==='ban'?'masuk daftar hitam':a.st==='wait'?'menunggu balasan':a.st==='invite'?'diundang hari ke-'+a.invDay:'ditolak (coba lagi nanti)';}

function applyJob(i){
  const j=JOBS[i],a=S.apps[j.id];

    const net=g-fu+extra;S.money+=net;S.ojolN+=n;S.hustle++;drain(h*(car?6:9));S.sAdd=(S.sAdd||0)+(net<0?5:0);
    if(advance(h*60))return;
    gigMenu(msg+'\n'+n+' order, kotor '+rp(g)+', bensin '+rp(fu)+(extra?(extra>0?', bonus ':', rugi ')+rp(Math.abs(extra)):'')+'. Bersih '+rp(net)+'.');
  };
  const r=Math.random();
  if(r<.18)return show({k:'home'},'Hujan deras turun saat kamu sedang narik. Aplikasi menampilkan bonus hujan.',[
    {l:'Terobos hujan (+Rp 30rb, bisa sakit)',f:()=>{if(Math.random()<.3&&!(S.sick>0)){S.sick=3;S.sickK='flu';}fin(gross,fuel,30000,'Kamu menerobos hujan. Basah kuyup, bonus masuk.'+(S.sick>0?' Besoknya badanmu meriang.':''));}},
    {l:'Berteduh dulu (order -30%)',f:()=>fin(Math.round(gross*.7),fuel,0,'Kamu berteduh di warung sambil menunggu hujan reda.')}]);
  if(r<.34)return show({k:'home'},'Penumpang memberi bintang 5 dan menyelipkan tip, katanya kamu ramah. Kamu tersenyum lega.',[
    {l:'Terima kasih, Bu',f:()=>fin(gross,fuel,20000+rnd(5)*10000,'Rezeki kecil di tengah jalan.')}]);
  if(r<.5)return show({k:'home'},'Orderan fiktif. Alamat tujuan tidak ada, penumpang tidak menjawab, dan kamu sudah menempuh jarak jauh.',[
    {l:'Batalkan, terima rugi',f:()=>fin(gross,fuel,-20000,'Kamu membatalkan order dan melapor ke aplikasi.')},
    {l:'Cari sendiri alamatnya',f:()=>fin(gross,fuel,Math.random()<.4?25000:-35000,'Kamu muter-muter mencari alamat.')}]);
  if(r<.64)return show({k:'home'},'Penumpang minta turun di tengah jalan sambil marah-marah dan menolak bayar setelah protes soal rute.',[
    {l:'Minta baik-baik',f:()=>fin(gross,fuel,Math.random()<.5?0:-15000,'Kamu menahan emosi dan menyelesaikan dengan sopan.')},
    {l:'Hajar penumpang!',f:()=>startFight({who:'dc',bg:'door',hp:7,windT:.8,onEnd:won=>{S.sAdd=(S.sAdd||0)+8;if(won){fin(gross,fuel,-10000,'Penumpang kabur ketakutan. Akunmu kena laporan.');}else{S.money=Math.max(0,S.money-100000);S.energy=Math.max(0,S.energy-15);fin(Math.round(gross*.6),fuel,0,'Kamu babak belur dan uang dompetmu hilang Rp 100rb.');}}})}]);
  if(r<.7)return show({k:'tilang'},'Di tengah narik, kendaraanmu bersenggolan dengan angkot. Ada lecet dan perlu ongkos damai.',[
    {l:'Damai, ganti Rp 100rb',f:()=>fin(gross,fuel,-100000,'Kamu mengganti ongkos lecet. Hari yang sial.')}]);
  fin(gross,fuel,0,'Narik berjalan lancar tanpa kejadian besar.');
}

function gate(j){
  const job=JOBS[j],a=S.apps[job.id];
  if(job.tier===0){
    return show({k:'shopin',j:j},'Kamu melangkah masuk. Pemilik menyapa dari balik meja: "Cari siapa, Mas? Mau melamar kerja?"',[
      {l:'Ya, saya antar lamaran',f:()=>startIv(j,false)},{l:'Tidak jadi, permisi',f:()=>jobMenu(j)}]);
  }
  if(a&&a.st==='ban')return show({k:'gate',j:j},'Satpam mengenalimu: "Bapak yang waktu itu... Maaf, Anda tidak boleh masuk."',[{l:'Pamit',f:()=>jobMenu(j)}]);
  const ops=[];let txt='Satpam: "Selamat datang. Ada keperluan apa, Pak?"';
  if(a&&a.st==='invite'){
    if(a.invDay===S.day)ops.push({l:'Ada jadwal interview jam '+clk(a.invMin),f:()=>lobbyIn(j)});
    else txt='Satpam: "Jadwal Bapak hari ke-'+a.invDay+', jam '+clk(a.invMin)+'. Hari ini belum ada."';
  }else txt='Satpam: "Maaf, Pak. Di sini harus ada janji atau undangan dulu. Lamaran bisa lewat email atau dititip."';
  if(!a)ops.push({l:'Titip lamaran (butuh 1 set)',f:()=>{
    if(S.sets<1)return show({k:'gate',j:j},'Kamu tidak membawa berkas cetak. Satpam menggeleng.',[{l:'Kembali',f:()=>gate(j)}]);
    S.sets--;S.apps[job.id]={st:'wait',decide:S.day+2,pass:(S.cv.score+(S.edu===2?2:1)+rnd(2)-1)>=job.thr};
    show({k:'gate',j:j},'Satpam menerima berkasmu: "Nanti kami hubungi lewat email."',[{l:'Kembali',f:()=>jobMenu(j)}]);
  }});
  ops.push({l:'Hajar satpam!',f:()=>{startFight({who:'satpam',bg:'gate',j:j,hp:8,windT:.7,onEnd:won=>{
    S.apps[job.id]={st:'ban'};
    if(won)return fightEnd(j,'Satpam tumbang di depan pos. Kamu kabur sebelum ada yang melihat. Namamu dicatat sebagai pelaku, perusahaan ini kini menolakmu.');
    S.energy=Math.min(S.energy,20);S.money=Math.max(0,S.money-150000);
    fightEnd(j,'Kamu KO dan dikeroyok satpam lain. Dibawa ke pos, berdamai dengan Rp 150rb. Perusahaan ini kini menolakmu.');}});}});
  ops.push({l:'Pura-pura numpang ke WC',f:()=>tryWC(j)});
  ops.push({l:'Menyelinap masuk',f:()=>trySneak(j)});
  ops.push({l:'Pamit',f:()=>jobMenu(j)});
  show({k:'gate',j:j},txt,ops);
}

function wcLobby(j){
  const job=JOBS[j];
  show({k:'lobby',j:j},'Kamu berdiri di lobi gedung. Resepsionis sibuk menerima telepon. Lift dan tangga menuju lantai HRD ada di belakangnya.',[

      if(S.sets<1||!S.cv)return show({k:'lobby',j:j},'Kamu tidak membawa berkas cetak. Resepsionis menggeleng.',[{l:'Kembali',f:()=>wcLobby(j)}]);

function trySneak(j){
  const job=JOBS[j];S.crime++;if(advance(10))return;

    iv={j:j,job:job,si:0,bonus:-1,qs:[],qi:0,score:0,div:null,react:''};
    return show({k:'lobby',j:j},'Kamu ikut rombongan karyawan masuk lewat pintu samping dan naik ke lantai HRD. Staf HRD heran: "Anda siapa? Ada janji?"',[
      {l:'Saya mau melamar, Pak/Bu',f:runStage},{l:'Mundur pelan-pelan',f:()=>jobMenu(j)}]);
  }
  if(advance(60))return;
  drain(15);S.sAdd=(S.sAdd||0)+8;S.apps[job.id]={st:'ban'};S.evil++;
  show({k:'gate',j:j},'Satpam menangkap lenganmu: "Mau ke mana, Mas?!" Kamu digiring ke pos, KTP difoto, dan namamu dicatat. Perusahaan ini kini menolak namamu. (-60 menit)',[{l:'Pergi dengan malu',f:()=>jobMenu(j)}]);
}
function lobbyIn(j){
  const job=JOBS[j],a=S.apps[job.id];
  iv={j:j,job:job,si:0,bonus:0,qs:[],qi:0,score:0,div:null,react:''};
  const late=S.min-a.invMin;
  if(late>60){
    a.st='rej';a.cool=S.day+3;
    return show({k:'gate',j:j},'Kamu terlambat '+late+' menit. Resepsionis: "Mohon maaf, jadwal Bapak sudah dibatalkan."',[{l:'Pulang',f:()=>jobMenu(j)}]);
  }
  let t='Satpam: "Silakan, KTP ditukar kartu tamu ya."';
  if(late>0){iv.bonus-=1;t+='\nKamu terlambat '+late+' menit. HRD pasti mencatatnya.';}
  show({k:'gate',j:j},t,[{l:'Serahkan KTP, ambil kartu tamu',f:()=>lobbyDesk(j)}]);
}
function lobbyDesk(j){
  show({k:'lobby',j:j},'Resepsionis: "Silakan isi buku tamu. Tujuan: HRD."',[
    {l:'Isi lengkap dan rapi',f:()=>lobbyWait(j,0)},
    {l:'Isi seadanya, tulisan asal',f:()=>lobbyWait(j,-1)}]);

function lobbyWait(j,b){
  iv.bonus+=b;const a=S.apps[iv.job.id];
  if(S.min<a.invMin){const w=a.invMin-S.min;advance(w);}
  advance(10);
  show({k:'lobby',j:j},'Kamu duduk di ruang tunggu. Jantung berdebar, dan HP-mu bergetar keras di saku.',[
    {l:'Silent-kan HP, tarik napas',f:()=>{iv.bonus+=1;runStage();}},
    {l:'Biarkan saja, buka medsos',f:()=>{runStage();}}]);
}
function startIv(j,x){
  const job=JOBS[j];
  iv={j:j,job:job,si:0,bonus:0,qs:[],qi:0,score:0,div:null,react:''};
  show({k:'shopin',j:j},'Kamu menyerahkan lamaran langsung ke pemilik.',[{l:'Lanjut',f:runStage}]);
}
const WHO={owner:'owner',psiko:'psiko',hrd:'hrd',user:'user',dir:'dir'};
const INTRO={owner:'Pemilik usaha menyambutmu santai sambil membolak-balik CV-mu.',psiko:'Kamu diminta mengerjakan psikotes singkat di ruang tes.',hrd:'HRD tersenyum: "Silakan duduk. Kita mulai wawancaranya."',user:'Calon atasan (user) masuk membawa CV-mu dan duduk di depanmu.',dir:'Direktur menatapmu dari balik meja besar. Ini tahap terakhir.'};
function runStage(){
  const st=iv.job.stages[iv.si];
  if(!st)return offer();
  if(st.k==='admin')return adminCheck();
  if(st.k==='user'&&st.div&&!iv.div)return pickDiv();
  const key=st.k==='user'?(iv.div||'admin'):st.k;
  iv.qs=shuf(BANK[key]).slice(0,st.n);iv.qi=0;iv.score=0;iv.react='';
  show({k:'room',who:WHO[st.k]},'Tahap '+(iv.si)+'/'+(iv.job.stages.length-1)+'. '+INTRO[st.k],[{l:'Mulai',f:askQ}],{ah:62});
}
function adminCheck(){
  const job=iv.job;
  if(S.record&&job.tier===2){const a=S.apps[job.id]||(S.apps[job.id]={});a.st='rej';a.cool=S.day+3;return show({k:'lobby',j:iv.j},'HRD memeriksa SKCK-mu dan menggeleng: "Maaf, ada catatan kriminal. Perusahaan kami tidak bisa menerima."',[{l:'Pulang',f:()=>{S.at=job.loc;jobMenu(iv.j);}}]);}
  if(S.sets<job.sets){
    return show({k:iv.job.tier?'lobby':'shopin',j:iv.j},'"Berkasnya kurang. Perlu '+job.sets+' set (CV, KTP, ijazah). Bapak baru bawa '+S.sets+'." Lengkapi di fotokopi lalu kembali selama jadwal masih berlaku.',[{l:'Keluar & lengkapi berkas',f:()=>{S.at=job.loc;scene='map';selDest=-1;}}]);
  }
  S.sets-=job.sets;iv.si++;
  show({k:iv.job.tier?'lobby':'shopin',j:iv.j},'Berkas diperiksa: CV, KTP, dan ijazah lengkap. "Baik, silakan tunggu sebentar."',[{l:'Lanjut',f:runStage}]);
}
function pickDiv(){
  show({k:'room',who:'hrd'},'HRD: "Divisi mana yang paling kamu minati? Penempatan ini menentukan wawancara berikutnya."',[
    {l:'Administrasi (data dan laporan)',f:()=>{iv.div='admin';runStage();}},
    {l:'Operasional (logistik dan kontrol)',f:()=>{iv.div='ops';runStage();}},
    {l:'Pemasaran (promosi dan klien)',f:()=>{iv.div='mkt';runStage();}}],{ah:62});
}
function askQ(){
  const st=iv.job.stages[iv.si],q=iv.qs[iv.qi];
  const ops=shuf(q.o).map(o=>({l:o[0],f:()=>answer(o[1]),dim:S.conf>=4&&o[1]===0}));
  show({k:'room',who:WHO[st.k]},(iv.react?iv.react+'\n':'')+'['+(iv.qi+1)+'/'+st.n+'] '+q.q,ops,{ah:62});
}
function answer(sc){
  iv.score+=sc;iv.react=sc===2?'Mengangguk puas.':sc===1?'Mencatat tanpa ekspresi.':'Mengerutkan dahi.';iv.qi++;
  const st=iv.job.stages[iv.si];
  if(iv.qi<st.n)return askQ();
  endStage();
}
function endStage(){
  const st=iv.job.stages[iv.si],job=iv.job,tier=job.tier;
  let bonus=Math.min(2,Math.floor(S.conf/2))+iv.bonus;
  const sk=S.cv?S.cv.skills:[];
  if(st.k==='hrd'&&S.cv&&S.cv.score>=10)bonus+=1;
  if(st.k==='hrd'&&S.connect&&tier>=1)bonus+=1;
  if((st.k==='hrd'||st.k==='dir')&&S.evil>=3)bonus-=1;
  if(S.record&&(st.k==='hrd'||st.k==='owner'))bonus-=(tier>=1?2:1);
  if(st.k==='hrd'&&tier===2&&sk.includes('inggris'))bonus+=1;
  if(st.k==='user'){const d=iv.div||'admin';if((d==='admin'&&(sk.includes('excel')||sk.includes('ngetik')))||(d==='ops'&&sk.includes('komunikasi'))||(d==='mkt'&&(sk.includes('komunikasi')||sk.includes('desain'))))bonus+=1;}
  if(st.k==='dir'&&sk.includes('inggris'))bonus+=1;
  if(S.energy<15)bonus-=1;
  if(S.hunger>=75)bonus-=1;
  if(S.sick>0)bonus-=1;
  const thr=Math.ceil(st.n*(0.9+0.3*tier)),total=iv.score+bonus;
  drain(8);
  const out=iv.react;
  if(advance(25))return;
  if(total>=thr){
    iv.si++;iv.bonus=0;
    const last=!job.stages[iv.si];
    show({k:'room',who:WHO[st.k]},out+'\nKamu lolos tahap ini'+(last?'. Tinggal menunggu keputusan akhir.':'. Silakan tunggu untuk tahap berikutnya.'),[{l:'Lanjut',f:runStage}],{ah:62});
  }else{
    const a=S.apps[job.id]||(S.apps[job.id]={});a.st='rej';a.cool=S.day+3;
    show({k:'room',who:WHO[st.k]},out+'\n"Terima kasih sudah datang. Kami akan kabari lewat email." Kamu paham, ini artinya belum lolos. Coba lagi dengan persiapan lebih baik.',[{l:'Pulang',f:()=>{S.at=job.loc;jobMenu(iv.j);}}],{ah:62});
  }
}
function offer(){
  const job=iv.job;
  show({k:'room',who:job.tier===0?'owner':job.tier===1?'hrd':'dir'},'Selamat! Kamu ditawari posisi '+job.pos+' di '+job.name+' dengan gaji '+rp(job.sal)+' per bulan. Mulai kerja Senin depan.',[
    {l:'Terima tawaran',f:win},
    {l:'Tolak, merintis usaha sendiri',off:S.money<300000,f:()=>workStart(job,true)},
    {l:'Tolak, lanjut cari lain',f:()=>{const a=S.apps[job.id]||(S.apps[job.id]={});a.st='rej';a.cool=S.day+3;S.at=job.loc;jobMenu(iv.j);}}],{ah:62});
}
function win(){
  const job=iv.job;
  show({k:'win'},'Kamu diterima sebagai '+job.pos+' di '+job.name+'!\nGaji '+rp(job.sal)+' | Hari ke-'+S.day+' | Sisa uang '+rp(S.money)+(S.car?' | Mobil':'')+(S.house?' | Rumah KPR':'')+(openBills().length?' | Tagihan belum lunas: '+openBills().length:'')+'\n'+LIFE[S.life].n+' | '+karma()+'. Level 1 selesai.',[{l:'Lanjut: mulai bekerja (12 bulan)',f:()=>workStart(job,false)},{l:'Main lagi',f:()=>{clearSave();hasSave=false;scene='title';}}]);
}
function yearEnd(job,biz){
  const W_=S.work||{},k=S.evil+S.crime;
  const debt=openBills().reduce((a,b)=>a+b.amt,0);
  let kind,title,art,txt;
  const sum='Sisa uang '+rp(S.money)+' | Utang '+rp(debt)+' | Jalan hidup: '+karma()+(S.car?' | Mobil':'')+(S.house?' | Rumah KPR':'');
  if(S.money<0||debt>=Math.max(4000000,(W_.sal||2000000)*3)||(S.blacklist&&(W_.late||0)>=4)||(W_.late||0)>=10){

    txt='Gajimu selalu habis sebelum tanggal tua. Cicilan menumpuk, denda berbunga, dan telepon penagih tidak pernah berhenti. Setahun kemudian kamu masih bekerja, tapi hampir seluruh gajimu menguap untuk membayar utang lama.';
  }else if(k>=4){
    kind='preman';title='JADI PREMAN';art={k:'preman'};

    txt+=' Setahun kemudian orang-orang pasar memanggilmu "Bang" dan membayarmu untuk menjaga lapak. Kamu jadi preman.';
  }else if(biz){
    const hs=Math.min(S.hustle,6),p=.35+.08*hs+Math.min(.25,Math.max(0,S.money)/4000000)+Math.min(.15,(W_.onTime||0)/60)-(W_.late||0)*.04-(S.record?.1:0);
    if(Math.random()<p){kind='umkm';title='PENGUSAHA UMKM';art={k:'umkm'};
      txt='Modal kecilmu kamu putar jadi usaha. Pengalaman narik dan serabutan mengajarimu soal rezeki harian. Setahun kemudian warungmu punya pelanggan tetap dan dua karyawan. Kamu kini pengusaha UMKM.';}
    else{kind='biasa';title='KARYAWAN BIASA';art={k:'win',title:'USAHA BANGKRUT'};
      txt='Usahamu bangkrut di pertengahan tahun karena modal kurang dan pelanggan sepi. Kamu melamar lagi dan akhirnya bekerja sebagai karyawan biasa, kini lebih sadar risiko.';}
  }else if(W_.unemp&&!biz){
    kind='nganggur';title='MASIH MENGANGGUR';art={k:'lose'};
    txt='Setelah resign atau dipecat, kamu belum juga mendapat pekerjaan baru. Tabungan menipis dan kamu terus mengirim lamaran ke mana-mana.';
  }else{
    const perf=S.conf+(S.cv?S.cv.score/3:0)+job.tier*1.5+rnd(3)+Math.min(3,(W_.onTime||0)/6)-(W_.late||0)-(W_.fired?3:0)-(S.record?2:0)-k*1.5;
    if(perf>=6&&!W_.fired&&(W_.late||0)<=1&&debt<=(W_.sal||0)*.5&&!W_.scandal&&(W_.sp||0)<=1&&(W_.rep||0)>=5){kind='prestasi';title='KARYAWAN BERPRESTASI';art={k:'win',title:'KARYAWAN BERPRESTASI'};
      txt='Setahun kemudian kamu dinobatkan karyawan terbaik di '+job.name+'. Gajimu naik jadi '+rp(Math.round(job.sal*1.25/50000)*50000)+' dan atasan menawarimu posisi supervisor.';}
    else{kind='biasa';title='KARYAWAN BIASA';art={k:'win',title:'KARYAWAN BIASA'};
      txt='Setahun kemudian kamu masih bekerja di '+(job?job.name:'kantor')+'. Hidup berjalan stabil, tapi belum ada promosi. Cukup untuk membayar tagihan dan menabung pelan-pelan.';}
  }
  if(S.house&&kind!=='utang')txt+=' Cicilan rumah berjalan dan kamu punya tempat pulang sendiri.';
  if(S.car&&S.life!=='easy'&&kind!=='utang')txt+=' Mobil kreditanmu jadi tanda kerja kerasmu.';
  if(W_.fired&&!W_.unemp)txt+=' Kamu sempat dipecat di tengah tahun dan harus bangkit lagi.';
  if(W_.scandal)txt+=' Skandal kantor masih membekas dan nama baikmu tidak sepenuhnya pulih.';
  if((W_.switched||0)>0&&!W_.unemp)txt+=' Kamu berpindah kerja demi karier yang lebih baik.';
  show({k:'night'},'Dua belas bulan berlalu... Satu tahun setelah hari pertamamu mencari kerja.',[{l:'Lanjut',f:()=>show(art,title+'\n'+txt+'\n'+sum,[{l:'Lihat rincian',f:()=>endDetail(kind,title,job,biz)}])}]);
}
function endDetail(kind,title,job,biz){
  const W_=S.work||{},debt=openBills().reduce((a,b)=>a+b.amt,0),sal=W_.sal||0;

// ===== Fase bekerja =====
const INT={pinjol:.12,paylater:.05,kartu:.035,kmacet:.05,sisa:.02,hp:.03,motor:.02,mobil:.02,rumah:.02,kta:.018,kos:.02};
const PRI=['mobil','rumah','kartu','kmacet','sisa','kta','motor','pinjol','kos','paylater','hp','tetangga','warteg','hamil','sekolah','sakit'];
function wJob(){return S.work&&S.work.job?JOBS.find(j=>j.id===S.work.job):null;}
function workStart(job,biz){
  S.work={job:job.id,biz:!!biz,m:0,sal:biz?0:job.sal,fired:0,onTime:0,late:0,perf:0,rep:5,sp:0,lateTot:0,aff:0,affM:0,scandal:false,unemp:false,switched:0,searchDone:false};
  if(biz)S.money=Math.max(0,S.money-300000);
  S.at=0;workMonth();
}
function monthCost(){const base=S.life==='easy'?1200000:S.life==='normal'?1900000:S.life==='hard'?2300000:2100000;return Math.round(base-(S.house&&S.life!=='easy'?600000:0)+Math.max(0,S.daily-15000)*45);}
function workResume(){workMonth(true);}
function billsDue(){return S.bills.filter(b=>!b.paid&&b.due<=S.day);}
function workMonth(resume){
  const w=S.work;
  if(!resume){
    w.m++;
    if(w.m>12){clearSave();hasSave=false;return yearEnd(wJob(),w.biz);}
    S.day+=30;S.min=480;S.hunger=20;S.energy=100;
    if(S.sick>0){S.sick=0;S.sickK=null;}
    S.stress=Math.round((S.stress||0)*.5)+(S.sAdd||0);S.sAdd=0;
    for(const b of S.bills.slice())if(b.paid&&b.rec&&!b.renewed){b.renewed=true;if(b.left!==undefined&&b.left<=1)continue;S.bills.push(Object.assign(mkBill(b.k,b.base,b.due+b.rec),{rec:b.rec,base:b.base,left:b.left===undefined?undefined:b.left-1}));}
    let inc=0,note='';
    const hardL=S.life==='hard'||S.life==='random';
    // bunga tunggakan berbunga-bunga
    for(const b of S.bills)if(!b.paid&&b.due<=S.day-30){const r=INT[b.k]||.03;b.amt=Math.round(b.amt*(1+r)/1000)*1000;}
    if(w.m%4===0){let up=false;for(const b of S.bills)if(b.k==='rumah'){up=true;if(!b.paid)b.amt=Math.round(b.amt*1.05/1000)*1000;if(b.base)b.base=Math.round(b.base*1.05/1000)*1000;}if(up)note+=' Suku bunga KPR naik, cicilan rumah naik 5%.';}
    w.searchDone=false;
    if(w.unemp){inc=S.ojol?600000:0;note+=' Kamu sedang menganggur.'+(S.ojol?' Narik ojol dapat Rp 600rb.':'')+' Cari kerja lewat menu Lainnya.';}
    else if(w.biz){const hs=Math.min(S.hustle,6);inc=Math.round((1800000+hs*350000)*(.6+Math.random()*.8)/10000)*10000;if(Math.random()<(hardL?.22:.14)){inc=Math.round(inc*.2/10000)*10000;note+=' Bulan ini usahamu sepi.';}}
    else if(w.fired>0){inc=S.ojol?600000:0;w.fired--;note+=' Kamu sedang menganggur.'+(S.ojol?' Narik ojol dapat Rp 600rb.':'');if(w.fired===0){w.sal=Math.round(w.sal*.7/50000)*50000;note+=' Kamu dapat kerja baru dengan gaji lebih rendah.';}}
    else{inc=Math.round(w.sal*(S.life==='hard'?.9:.96)/10000)*10000;if(w.m===1)note+=' Gaji sudah dipotong BPJS dan pajak.';}
    w.sideDone=false;w.cost=monthCost()+Math.round(Math.max(0,inc-4000000)*.25/10000)*10000;S.money+=inc-w.cost;
    w.cur={inc:inc,note:note};
    save();
  }
  const due=billsDue(),tot=due.reduce((a,b)=>a+b.amt,0),w2=w.cur||{inc:0,note:''};
  const list=due.length?due.map(b=>b.n+' '+rp(b.amt)).join(', '):'tidak ada';
  const more={l:'Lainnya (sampingan, pinjaman, kerja)',f:()=>monthMore()};
  show({k:w.biz?'umkm':'home'},'BULAN KE-'+w.m+' DARI 12'+(w.biz?'':w.unemp?' | MENGANGGUR':' | '+(wJob()?wJob().pos:'')+' (Rep '+w.rep+'/10, SP '+w.sp+'/3)')+'\nPendapatan '+rp(w2.inc)+', biaya hidup -'+rp(w.cost||monthCost())+'.'+w2.note+'\nUangmu: '+rp(S.money)+'\nTagihan jatuh tempo: '+list+(due.length?' (total '+rp(tot)+')':''),due.length?[
    {l:'Bayar semua sesuai urutan prioritas',f:()=>{const ds=due.slice().sort((a,b)=>PRI.indexOf(a.k)-PRI.indexOf(b.k));for(const b of ds)if(S.money>=b.amt)payMonthBill(b);resolveMonth();}},
    {l:'Pilih tagihan yang dibayar',f:()=>monthPay()},
    more,
    {l:'Lewati, bayar nanti',f:()=>resolveMonth()}]:[more,{l:'Lanjut',f:()=>resolveMonth()}]);
}
function monthMore(){
  const w=S.work,ops=[];
  ops.push({l:w.sideDone?'Kerja sampingan (sudah diambil)':'Kerja sampingan (+Rp 900rb, stres +10)',off:!!w.sideDone,f:()=>{w.sideDone=true;S.money+=900000;S.sAdd=(S.sAdd||0)+10;workMonth(true);}});
  ops.push({l:'Pinjol darurat Rp 2jt (bunga 12%/bln)',f:()=>{S.money+=2000000;S.bills.push(mkBill('pinjol',2240000,S.day+30));S.sAdd=(S.sAdd||0)+3;workMonth(true);}});
  ops.push({l:S.blacklist||S.life==='hard'?'Pinjaman bank (ditolak, BI Checking)':'Pinjaman bank Rp 5jt (12 cicilan)',off:S.blacklist||S.life==='hard'||S.bills.some(b=>b.k==='kta'&&!b.paid)||w.m>8,f:()=>{if(!bankOk()){S.sAdd=(S.sAdd||0)+3;return show({k:'home'},'Bank menolak pengajuan pinjamanmu. Slip gaji dan riwayat kreditmu belum meyakinkan.',[{l:'Kembali',f:()=>workMonth(true)}]);}S.money+=5000000;S.bills.push(Object.assign(mkBill('kta',510000,S.day+30),{rec:30,base:510000,left:12}));workMonth(true);}});
  if(!w.biz)ops.push({l:w.searchDone?'Cari kerja lain (sudah bulan ini)':'Cari kerja lain / kirim lamaran',off:!!w.searchDone,f:()=>jobSearch()});
  if(!w.biz&&!w.unemp&&w.fired===0)ops.push({l:'Resign dari pekerjaan ini',f:()=>show({k:'room',who:'hrd'},'Yakin mau resign dari '+wJob().name+'? Tidak ada pesangon dan gajimu berhenti mulai bulan depan. Kamu harus mencari kerja baru.',[{l:'Ya, ajukan resign',f:()=>{w.unemp=true;w.sp=0;if(w.aff>0)w.aff=-2;S.sAdd=(S.sAdd||0)+5;workMonth(true);}},{l:'Batal',f:()=>monthMore()}])});
  ops.push({l:'Kembali',f:()=>workMonth(true)});
  show({k:'home'},'Pilih langkah tambahan bulan ini. Uangmu: '+rp(S.money),ops);
}
function jobSearch(){
  const w=S.work;
  const ops=JOBS.map(j=>({l:j.name.slice(0,16)+' '+rp(j.sal),off:!w.unemp&&w.fired===0&&j.id===w.job,f:()=>workApply(j)}));
  ops.push({l:'Batal',f:()=>monthMore()});
  show({k:'home'},'Kirim lamaran ke perusahaan mana? Perusahaan besar bergaji lebih tinggi tapi lebih sulit. Peluang bergantung percaya diri, CV, koneksi, dan riwayatmu.',ops);
}
function workApply(j){
  const w=S.work;w.searchDone=true;
  let p=(j.tier===0?.6:j.tier===1?.4:.22)+S.conf*.04+(S.cv?S.cv.score/70:0)+(S.connect?.1:0)-(S.record?.2:0)-(S.life==='hard'?.05:0)+((w.unemp||w.fired>0)?.05:0)-(w.scandal?.1:0);
  if(Math.random()<p){
    const nowJoin=()=>{w.job=j.id;w.sal=j.sal;w.unemp=false;w.fired=0;w.rep=4;w.sp=0;w.lateTot=w.lateTot||0;if(w.aff>0)w.aff=-2;w.switched++;workMonth(true);};
    if(w.unemp||w.fired>0)return show({k:'room',who:'hrd'},'Kabar baik! '+j.name+' menerimamu sebagai '+j.pos+' dengan gaji '+rp(j.sal)+'. Kamu mulai bekerja bulan ini.',[{l:'Mulai bekerja',f:nowJoin}]);
    return show({k:'room',who:'hrd'},j.name+' menawarimu posisi '+j.pos+' dengan gaji '+rp(j.sal)+'. Pindah berarti resign dari pekerjaan lama tanpa pesangon.',[{l:'Terima dan pindah',f:nowJoin},{l:'Tolak, tetap di sini',f:()=>workMonth(true)}]);
  }
  show({k:'room',who:'hrd'},'Lamaran ke '+j.name+' belum lolos seleksi. Coba lagi bulan depan atau tingkatkan CV dan percaya dirimu.',[{l:'Kembali',f:()=>workMonth(true)}]);
}
function payMonthBill(b){S.money-=b.amt;b.paid=true;S.work.onTime++;if(b.k==='motor'&&S.leasing){S.leasing=false;S.motor=true;}}
function monthPay(){
  const due=billsDue();
  const ops=due.map(b=>({l:b.n.slice(0,15)+' '+rp(b.amt),off:S.money<b.amt,f:()=>{payMonthBill(b);monthPay();}}));
  ops.push({l:'Selesai, lanjut',f:()=>resolveMonth()});
  show({k:'home'},'Pilih tagihan yang mau dibayar. Uangmu: '+rp(S.money)+'. Yang tidak dibayar akan menunggak, kena denda, dan bisa menyita aset.',ops);
}
function missBill(b,news){
  const w=S.work;w.late++;b.late+=3;
  const bankK=['mobil','rumah','kartu','motor','kta','sisa','kmacet'].includes(b.k);
  b.amt=Math.round(b.amt*(bankK?1.05:1.08)/1000)*1000;S.sAdd=(S.sAdd||0)+4;
  if(b.k==='mobil'&&S.car){S.car=false;S.sAdd+=8;b.k='sisa';b.n='Sisa utang mobil (ditarik)';b.amt=Math.max(b.amt,6000000);b.rec=0;b.due=S.day+30;b.late=0;news.push('Mobilmu ditarik leasing. DP hangus, tapi sisa utang Rp '+Math.round(b.amt/1000000)+'jt tetap harus dibayar.');return;}
  if(b.k==='rumah'&&S.house){S.house=false;S.sAdd+=12;b.k='sisa';b.n='Sisa utang KPR (disita)';b.amt=Math.max(b.amt,12000000);b.rec=0;b.due=S.day+30;b.late=0;news.push('Bank menyita rumahmu. DP hangus, kamu ngekos lagi, dan sisa utang Rp '+Math.round(b.amt/1000000)+'jt tetap ditagih.');return;}
  if(b.k==='kartu'){S.cc=null;S.blacklist=true;S.sAdd+=8;b.k='kmacet';b.n='Utang kartu macet';b.rec=0;news.push('Kartu kredit diblokir dan namamu masuk BI Checking. Utang kartu tetap berbunga 5% per bulan.');return;}
  if(b.k==='motor'&&S.motor){S.motor=false;S.leasing=true;news.push('Motormu ditarik leasing.');return;}
  if(b.k==='pinjol'){S.sAdd+=6;news.push('Debt collector pinjol meneror keluargamu. Bunga terus berjalan.');}
  else if(b.k==='kos')news.push('Ibu kos mengancam mengusirmu.');
  else news.push(b.n+' menunggak dan kena denda.');
  if(b.rec&&b.base)b.amt+=b.base;
}
function resolveMonth(){
  const w=S.work,news=[];
  const dd=billsDue();if(dd.length)w.lateM=(w.lateM||0)+1;
  for(const b of dd)missBill(b,news);
  S.stress=Math.min(100,(S.stress||0)+(S.sAdd||0));S.sAdd=0;
  // PHK
  if(!w.biz&&w.fired===0&&((S.stress>=85&&Math.random()<.35)||((w.lateM||0)>=3&&Math.random()<.3))){
    w.fired=2;const pes=Math.round(w.sal/50000)*50000;S.money+=pes;
    news.push('Kamu dipecat karena kinerja menurun. Pesangon '+rp(pes)+'.');
  }
  show({k:'home'},'HASIL BULAN KE-'+w.m+'\n'+(news.length?news.join('\n'):'Semua tagihan beres. Hidupmu tenang bulan ini.')+'\nUangmu: '+rp(S.money)+' | Stres '+Math.round(S.stress)+'/100',[{l:'Lanjut',f:()=>officeMonth()}]);
}

// ===== Kehidupan kantor =====
function wjIdx(){const i=JOBS.findIndex(x=>S.work&&x.id===S.work.job);return i<0?0:i;}
function evDone(msg){show({k:'home'},msg,[{l:'Lanjut',f:()=>monthEvent()}]);}
function offStress(n){S.stress=Math.min(100,(S.stress||0)+n);}
function repAdd(n){const w=S.work;w.rep=Math.max(0,Math.min(10,w.rep+n));}
function officeMonth(){
  const w=S.work;
  if(w.biz||w.unemp||w.fired>0)return monthEvent();
  show({k:'room',who:'hrd'},'KEHIDUPAN KANTOR - bulan ke-'+w.m+'\nReputasi '+w.rep+'/10 | SP '+w.sp+'/3 | Kantor: '+wJob().name+'\nBagaimana sikapmu bulan ini?',[
    {l:'Disiplin: datang pagi, kerja rapi',f:()=>officeRun(.35,'d')},
    {l:'Biasa saja',f:()=>officeRun(1,'b')},
    {l:'Santai: sering mepet jam masuk',f:()=>officeRun(1.9,'s')}]);
}
function officeRun(mult,style){
  const w=S.work,msg=[];
  const p=Math.min(.7,((S.car?.05:S.motor?.1:.18)+(S.stress>=60?.05:0))*mult);
  let late=0;for(let d=0;d<20;d++)if(Math.random()<p)late++;
  w.lateTot+=late;
  msg.push(late?('Kamu terlambat masuk '+late+' kali bulan ini'+(S.motor||S.car?'':' (angkot sering molor)')+'.'):'Kamu hampir tidak pernah terlambat bulan ini.');
  if(late){const cut=Math.round(w.sal*.01*late/10000)*10000;if(cut>0){S.money-=cut;msg.push('Gaji dipotong '+rp(cut)+'.');}}
  if(style==='d'&&late<=1&&Math.random()<.65){repAdd(1);msg.push('Atasan memperhatikan kedisiplinanmu. Reputasi naik.');}
  if(Math.random()<.3){repAdd(-1);msg.push('Persaingan di kantor membuat reputasimu sedikit tergerus.');}
  if(style==='s'){repAdd(-1);offStress(-3);msg.push('Sikap santaimu mulai dibicarakan rekan.');}
  if(late>=3&&late<5){repAdd(-1);msg.push('Atasan menegurmu soal keterlambatan.');}
  let fired=false;
  if(late>=5){w.sp++;repAdd(-1);msg.push('Kamu menerima Surat Peringatan '+w.sp+' dari HRD.');if(w.sp>=3)fired=true;}
  if(!fired&&w.rep<=1&&Math.random()<.5){fired=true;msg.push('Perusahaan melakukan efisiensi dan kinerjamu dinilai paling rendah.');}
  if(fired)return doFire(msg,'Kamu dipecat dari '+wJob().name+'.');
  if(w.m===6&&w.rep>=7){const ns=Math.round(w.sal*1.12/50000)*50000;msg.push('Kamu dipromosikan! Gaji naik jadi '+rp(ns)+'.');w.sal=ns;}
  show({k:'room',who:'hrd'},'HASIL KANTOR BULAN KE-'+w.m+'\n'+msg.join('\n')+'\nReputasi '+w.rep+'/10 | SP '+w.sp+'/3',[{l:'Lanjut',f:()=>pickOfficeEvent()}]);
}
function doFire(msg,line){

function fPunch(side){
  const f=fight;if(!f||f.over||f.cd>0)return;
  f.cd=.32;if(side==='l')f.pl=.22;else f.pr=.22;
  let dmg=1;if(f.state==='wind'){dmg=2;f.state='recover';f.t=0;f.msg='Serangan balik!';}else if(f.state==='stagger'){dmg=2;f.msg='Telak!';}else f.msg='Kena!';

function fGuard(){const f=fight;if(f&&!f.over)f.guard=.55;}
function updFight(dt){
  const f=fight;if(!f)return;
  if(f.over){f.endT-=dt;if(f.endT<=0&&!f.done){f.done=true;fight=null;f.onEnd(f.won);}return;}
  f.t+=dt;['cd','guard','flash','hit','pl','pr'].forEach(k=>{f[k]=Math.max(0,f[k]-dt);});
  if(f.state==='idle'){if(f.t>=f.next){f.state='wind';f.t=0;f.msg='Awas, dia ancang-ancang!';}}
  else if(f.state==='wind'){if(f.t>=f.windT){
    if(f.guard>0){f.msg='Tangkisan berhasil!';f.state='stagger';}
    else{S.energy=Math.max(0,S.energy-f.dmg);f.flash=.25;f.msg='Kamu kena pukul!';f.state='recover';}
    f.t=0;}}
  else if(f.state==='stagger'){if(f.t>=.7){f.state='idle';f.t=0;f.next=.8+Math.random()*.8;}}
  else if(f.state==='recover'){if(f.t>=.5){f.state='idle';f.t=0;f.next=.7+Math.random()*.9;}}
  if(f.hp<=0){f.over=true;f.won=true;S.evil++;}
  else if(S.energy<=0){f.over=true;f.won=false;}
}
